<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eğitim ve Toplantılar | İTF Geriatri</title><style>:root{font:18px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:#203a30;background:#f7faf7;--green:#285b4d;--deep:#1c443b;--line:#d3e3d8}*{box-sizing:border-box}body{margin:0}header{background:var(--deep);color:white;padding:24px max(22px,calc((100vw - 900px)/2))}header a{color:white}h1{font-size:clamp(1.65rem,4vw,2.2rem);line-height:1.25;margin:20px 0 0}main{max-width:900px;margin:auto;padding:30px 22px}.intro{max-width:730px;color:#445f50}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:26px 0}.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;padding:25px;border-radius:14px;border:2px solid var(--line);background:#fff;color:#203a30;min-height:175px}.tile:hover{border-color:var(--green);background:#f0f7f2}.tile strong{font-size:1.2rem;color:var(--deep)}.tile .icon{font-size:2rem}.tile small{font-size:.92rem;color:#4e6657}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin:20px 0}.card h2{font-size:1.2rem;color:var(--deep);margin:0 0 8px}.muted{color:#55695d}.back{display:inline-flex;color:var(--green);font-weight:700;text-decoration:none;min-height:44px;align-items:center}.lang{float:right;display:flex;gap:7px}.lang button{background:#fff;color:var(--deep);font:inherit;padding:8px 12px;border:1px solid #c4d6ca;border-radius:7px;min-width:48px;min-height:44px;cursor:pointer}.lang button[aria-pressed=true]{background:#d5eedc;font-weight:800}a:focus-visible,button:focus-visible{outline:3px solid #b77700;outline-offset:3px}@media(max-width:630px){.grid{grid-template-columns:1fr}main{padding:22px 17px}.tile{min-height:145px;padding:19px}}</style></head><body><header><a id="back" href="index.html">← Ana sayfa</a><div class="lang" role="group" aria-label="Dil / Language"><button id="tr" type="button" aria-pressed="true">TR</button><button id="en" type="button" aria-pressed="false">EN</button></div><h1 id="title">Eğitim ve Toplantılar</h1></header><main><p class="intro" id="intro">Eğitim etkinlikleri ve toplantılar için ilgili bölümü seçin.</p><nav class="grid" aria-label="Eğitim ve toplantı bölümleri"><a class="tile" id="mgtLink" href="mgt.html?lang=tr"><span class="icon" aria-hidden="true">🤝</span><strong id="mgtTitle">Multidisipliner Geriatri Toplantıları (MGT)</strong><small id="mgtDesc">Toplantı duyuruları ve arşivi</small></a><a class="tile" id="journalLink" href="dergi-kulubu.html?lang=tr"><span class="icon" aria-hidden="true">📖</span><strong id="journalTitle">Dergi Kulübü</strong><small id="journalDesc">Makale tartışmaları ve oturumlar</small></a></nav></main><script>
const words={tr:{back:"← Ana sayfa",title:"Eğitim ve Toplantılar",intro:"Eğitim etkinlikleri ve toplantılar için ilgili bölümü seçin.",mgtTitle:"Multidisipliner Geriatri Toplantıları (MGT)",mgtDesc:"Toplantı duyuruları ve arşivi",journalTitle:"Dergi Kulübü",journalDesc:"Makale tartışmaları ve oturumlar"},en:{back:"← Home",title:"Education and Meetings",intro:"Choose a section for educational sessions and meetings.",mgtTitle:"Multidisciplinary Geriatrics Meetings (MGT)",mgtDesc:"Meeting announcements and archive",journalTitle:"Journal Club",journalDesc:"Article discussions and sessions"}};
