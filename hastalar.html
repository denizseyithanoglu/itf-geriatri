<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasta Sağlık Rehberi | İTF Geriatri</title><style>:root{font:18px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:#243a30;background:#f6f9f6}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:#fff;padding:25px max(20px,calc((100vw - 950px)/2))}header a{color:#fff}main{max-width:950px;margin:auto;padding:20px}.intro{font-size:1.09rem;color:#44584b}.notice{padding:14px;background:#fff1d4;border-left:5px solid #a2701c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}.card{background:#fff;border:1px solid #d5e4da;border-radius:12px;padding:20px;scroll-margin-top:12px}.card h2{font-size:1.18rem;margin:5px 0;color:#23493b}.card p{margin:8px 0}.icon{font-size:1.6rem}.summary{color:#496051;font-weight:650}.card details{margin-top:12px}.card summary{cursor:pointer;color:#285b4d;font-weight:750;text-decoration:underline;text-underline-offset:3px;padding:6px 0}.callout{background:#e4f1e8;border-radius:10px;padding:20px;margin:20px 0}.button{display:inline-flex;min-height:48px;align-items:center;padding:11px 16px;background:#285b4d;border-radius:7px;color:#fff;text-decoration:none;font-weight:700}.lang{float:right}.lang button{font:inherit;padding:8px 12px;border:0;border-radius:5px;background:#fff;color:#285b4d;cursor:pointer}.muted{color:#51635a;font-size:.86rem}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #bd8300;outline-offset:3px}@media(max-width:630px){.grid{grid-template-columns:1fr}.card{padding:17px}}</style></head><body><header><a href="index.html" id="back"></a><div class="lang"><button type="button" id="tr">TR</button> <button type="button" id="en">EN</button></div><h1 id="title"></h1></header><main><p class="intro" id="intro"></p><div class="notice" id="warning"></div><div class="grid" id="topics"></div><div class="callout"><h2 id="self"></h2><p id="selfDesc"></p><a class="button" id="selfLink" href="tools/self-assessment.html"></a></div><p class="muted" id="footer"></p></main><script>const d={"tr":{"title":"Hasta ve Yakınları İçin Sağlık Rehberi","back":"← Ana sayfa","intro":"Yaşlılıkta sık karşılaşılan sorunlara dair anlaşılır, güvenilir başlangıç bilgileri.","warning":"Bu içerik genel bilgilendirme amaçlıdır; kişisel tanı veya tedavi önerisi değildir. İlaç değişikliklerini hekiminize danışınız.","topics":[["nutrition","Beslenme Önerileri","Düzenli öğünler ve yeterli protein","Gün boyunca düzenli ve çeşitli beslenmeye çalışın. Her ana öğünde yumurta, süt ürünleri, kurubaklagil, balık veya et gibi protein kaynaklarına yer verin. İştahsızlık, istemsiz kilo kaybı, çiğneme ya da yutma güçlüğü varsa sağlık ekibine başvurun. Sıvı miktarı kalp veya böbrek hastalığına göre değişebilir."],["polypharmacy","Çoklu İlaç Kullanımı (Polifarmasi)","İlaç listenizi birlikte gözden geçirin","Reçeteli ilaçlarınız, reçetesiz ürünleriniz, vitamin ve bitkisel ürünlerinizi içeren güncel bir liste tutun. Baş dönmesi, düşme, uyku hali veya yeni bir belirti olduğunda ilaçlarınızı değerlendirmesi için hekime başvurun. İlaçları kendi kendinize kesmeyin veya değiştirmeyin."],["urinary","İdrar Kaçırma","Konuşulabilir ve değerlendirilebilir bir durum","İdrar kaçırma yaşlanmanın kaçınılmaz bir sonucu değildir. Yakınmaların zamanı, sıklığı, eşlik eden yanma veya kabızlık gibi durumları not edin. Pelvik taban egzersizleri ve mesane eğitimi bazı kişilerde yararlı olabilir; uygun yaklaşımı sağlık profesyoneliyle belirleyin. İdrarda kan, ateş veya idrar yapamama durumunda gecikmeden değerlendirme gerekir."],["depression","Depresyon ve Ruh Sağlığı","Ruhsal belirtiler de sağlık bakımının parçasıdır","İki haftadan uzun süren çökkünlük, ilgi kaybı, uyku veya iştah değişiklikleri için değerlendirme isteyin. Depresyon yaşlılığın doğal bir parçası değildir ve tedavi seçenekleri vardır. Kendine zarar verme düşüncesi veya yakın tehlike varsa acil yardım alın."],["sarcopenia","Sarkopeni ve Kas Sağlığı","Kas gücünü korumak önemlidir","Güvenli ve kişiye uygun direnç egzersizleri, günlük hareket ve yeterli beslenme kas sağlığını destekleyebilir. Sandalyeden kalkmada zorlanma, yürüme hızında azalma veya tekrarlayan düşmeler varsa değerlendirme yaptırın. Egzersiz yoğunluğu hastalıklara ve düşme riskine göre uyarlanmalıdır."],["osteoporosis","Osteoporoz ve Kemik Sağlığı","Kırık riskini değerlendirin","Düşük travmalı kırık öyküsü, boy kısalması, uzun süreli kortikosteroid kullanımı veya ebeveynde kalça kırığı öyküsü varsa hekiminizle kemik sağlığını görüşün. Dengeli beslenme, uygun yük taşıyan hareket ve düşmelerden korunma önemlidir. Test ve ilaç gereksinimi kişiselleştirilir."]],"self":"Kendinizi Değerlendirin","selfDesc":"FRAIL, SARC-F, GYA, EGYA ve GDS-15 taramaları","read":"İçeriği oku","close":"Bölümü kapat","footer":"Son güncelleme: Ekim 2026 · Taslak hasta eğitimi içeriği. Kurumsal klinik inceleme tamamlanmamıştır."},"en":{"title":"Patient and Caregiver Health Guide","back":"← Home","intro":"Clear introductory information on common health issues in later life.","warning":"This is general educational information, not personalized diagnosis or treatment. Discuss medication changes with your clinician.","topics":[["nutrition","Nutrition Advice","Regular meals and adequate protein","Aim for regular, varied meals. Include sources of protein such as eggs, dairy, beans, fish or meat across meals. Seek professional advice for poor appetite, unintentional weight loss, or chewing and swallowing difficulties. Fluid targets may differ with heart or kidney conditions."],["polypharmacy","Polypharmacy","Review your medication list together","Keep an updated list of prescriptions, over-the-counter products, vitamins and herbal products. Discuss new dizziness, falls, sleepiness or symptoms with a clinician. Do not stop or change medications independently."],["urinary","Urinary Incontinence","A common concern that deserves evaluation","Incontinence is not an inevitable part of ageing. Note the frequency and circumstances of leakage, along with burning or constipation. Pelvic floor exercises and bladder training may help some people. Seek prompt evaluation for blood in urine, fever, or inability to pass urine."],["depression","Depression and Mental Health","Emotional symptoms matter too","Ask for evaluation if persistent low mood, loss of interest or changes in sleep or appetite last more than two weeks. Depression is not a normal consequence of ageing, and treatments are available. If there is an immediate risk of self-harm, seek emergency assistance."],["sarcopenia","Sarcopenia and Muscle Health","Preserving muscle strength matters","Appropriate resistance exercise, regular movement and sufficient nutrition can help support muscle health. Difficulty rising from a chair, slower walking or repeated falls merit assessment. Activity should be tailored to your health and fall risk."],["osteoporosis","Osteoporosis and Bone Health","Understand your fracture risk","Discuss bone health if you have a low-trauma fracture, height loss, long-term corticosteroid exposure or a parent with a hip fracture. Balanced nutrition, suitable weight-bearing activity and fall prevention matter. Testing and medication decisions are individualized."]],"self":"Try Self-assessment","selfDesc":"FRAIL, SARC-F, ADL, IADL and GDS-15 screening","read":"Read more","close":"Close topic","footer":"Updated October 2026 · Draft patient education content pending institutional clinical review."}};let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr";const $=x=>document.getElementById(x);const icons=["🥗","💊","🚻","💬","💪","🦴"];function render(){document.documentElement.lang=lang;const t=d[lang];for(const id of ["title","back","intro","warning","self","selfDesc","footer"])$(id).textContent=t[id];$("selfLink").textContent=t.self;$("selfLink").href="tools/self-assessment.html?lang="+lang;$("topics").innerHTML=t.topics.map((x,i)=>'<section class="card" id="'+x[0]+'"><div class="icon" aria-hidden="true">'+icons[i]+'</div><h2>'+x[1]+'</h2><div class="summary">'+x[2]+'</div><details '+(location.hash==="#"+x[0]?"open":"")+'><summary>'+t.read+'</summary><p>'+x[3]+'</p></details></section>').join("")} $("tr").onclick=()=>{lang="tr";render()};$("en").onclick=()=>{lang="en";render()};render();</script></body></html>
