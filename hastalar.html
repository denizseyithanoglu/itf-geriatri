<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasta Sağlık Rehberi | İTF Geriatri</title><style>:root{font:18px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:#243a30;background:#f6f9f6}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:#fff;padding:25px max(20px,calc((100vw - 950px)/2))}header a{color:#fff}main{max-width:950px;margin:auto;padding:20px}.intro{font-size:1.09rem;color:#44584b}.notice{padding:14px;background:#fff1d4;border-left:5px solid #a2701c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}.card{background:#fff;border:1px solid #d5e4da;border-radius:12px;padding:20px;scroll-margin-top:12px}.card h2{font-size:1.27rem;margin:5px 0;color:#23493b}.card p{margin:8px 0}.icon{font-size:1.75rem}.nutrition-cta{background:#e8f3eb;border:1px solid #bcd7c4}.summary{color:#496051;font-weight:650}.card details{margin-top:12px}.card summary{cursor:pointer;color:#285b4d;font-weight:750;text-decoration:underline;text-underline-offset:3px;padding:6px 0}.callout{background:#e4f1e8;border-radius:10px;padding:20px;margin:20px 0}.button{display:inline-flex;min-height:48px;align-items:center;padding:11px 16px;background:#285b4d;border-radius:7px;color:#fff;text-decoration:none;font-weight:700}.lang{float:right}.lang button{font:inherit;padding:8px 12px;border:0;border-radius:5px;background:#fff;color:#285b4d;cursor:pointer}.muted{color:#51635a;font-size:.86rem}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #bd8300;outline-offset:3px}@media(max-width:630px){.grid{grid-template-columns:1fr}.card{padding:17px}}</style></head><body><header><a href="index.html" id="back"></a><div class="lang"><button type="button" id="tr">TR</button> <button type="button" id="en">EN</button></div><h1 id="title"></h1></header><main><p class="intro" id="intro"></p><div class="notice" id="warning"></div><div class="callout nutrition-cta"><h2 id="nutritionTitle">Beslenme Önerileri</h2><p id="nutritionDesc"></p><a class="button" id="nutritionLink" href="beslenme-onerileri.html">Beslenme Önerilerini Oku →</a></div><div class="grid" id="topics"></div><section class="callout"><h2 id="ministryTitle">T.C. Sağlık Bakanlığı Kaynakları</h2><ul><li><a href="https://yalvacdh.saglik.gov.tr/TR-820531/yasli-sagligi-rehberleri.html" target="_blank" rel="noopener">Yaşlı Sağlığı Rehberleri</a></li><li><a href="https://ankarasehir.saglik.gov.tr/TR-1389775/v---geriatri-biliminin-ilgilendigi-konular-nelerdir.html" target="_blank" rel="noopener">Geriatrik Sendromlar ve Tedavileri</a></li><li><a href="https://hsgm.saglik.gov.tr/depo/birimler/aile-hekimligi-uygulama-ve-gelistirme-db/Dokumanlar/Yonerge/EK8_Cok_Yonlu_Yasli_Sagligi_Degerlendirmesi.pdf" target="_blank" rel="noopener">Çok Yönlü Yaşlı Sağlığı Değerlendirmesi</a></li></ul></section><div class="callout"><h2 id="self"></h2><p id="selfDesc"></p><a class="button" id="selfLink" href="tools/self-assessment.html"></a></div><section class="callout" id="resources"><h2 id="resourcesTitle"></h2><p id="resourcesDesc"></p><a class="button" href="https://www.osteoporosis.foundation/" target="_blank" rel="noopener noreferrer">International Osteoporosis Foundation (IOF) ↗</a></section><p class="muted" id="footer"></p></main><script>const d={"tr":{"title":"Hasta ve Yakınları İçin Sağlık Rehberleri","back":"← Ana sayfa","intro":"Yaşlılıkta sık karşılaşılan sorunlara dair anlaşılır, güvenilir başlangıç bilgileri.","warning":"Bu içerik genel bilgilendirme amaçlıdır; kişisel tanı veya tedavi önerisi değildir. İlaç değişikliklerini hekiminize danışınız.","topics":[["dementia","Demans ve Bilişsel Gerileme","Belirtiler ve ne zaman destek alınmalı","Bellek, dil, planlama ve günlük yaşam işlevlerini etkileyen ilerleyici sorunlardır. Her unutkanlık demans değildir; değerlendirme gerekir. Unutkanlık günlük yaşamı etkiliyorsa değerlendirme için başvurun. İlaç listesini, işlev değişikliklerini ve yakınınızın gözlemlerini paylaşın."],["delirium","Deliryum","Belirtiler ve ne zaman destek alınmalı","Saatler veya günler içinde başlayan, dalgalanan dikkat ve farkındalık bozukluğudur. Ani kafa karışıklığı acil tıbbi değerlendirme gerektirir. Saatler veya günler içinde gelişen ani kafa karışıklığı acil değerlendirme gerektirir. Enfeksiyon, susuzluk ve ilaçlar gibi nedenler araştırılmalıdır."],["depression","Depresyon ve Ruhsal Sorunlar","Ruhsal belirtiler de sağlık bakımının parçasıdır","İki haftadan uzun süren çökkünlük, ilgi kaybı, uyku veya iştah değişiklikleri için değerlendirme isteyin. Depresyon yaşlılığın doğal bir parçası değildir ve tedavi seçenekleri vardır. Kendine zarar verme düşüncesi veya yakın tehlike varsa acil yardım alın."],["frailty","Kırılganlık","Belirtiler ve ne zaman destek alınmalı","Stres etkenlerine karşı dayanıklılığın azalmasıdır. Yorgunluk, güçsüzlük, yavaşlama ve kilo kaybı gibi belirtilerle görülebilir; normal yaşlanma ile aynı değildir. İstem dışı kilo kaybı, yavaşlama, güçsüzlük ve çabuk yorulmayı sağlık ekibine bildirin. Güvenli fiziksel aktivite ve yeterli beslenme planlayın."],["malnutrition","Kötü Beslenme (Malnütrisyon)","Belirtiler ve ne zaman destek alınmalı","İstem dışı kilo kaybı, iştahsızlık ve yetersiz protein/enerji alımı güçsüzlük ile ilişkili olabilir. Çiğneme ve yutma sorunları da değerlendirilmelidir. İstemsiz kilo kaybını takip edin; öğün atlama, iştahsızlık ve düşük gıda alımı için destek isteyin."],["swallowing","Çiğneme ve Yutma Problemleri","Belirtiler ve ne zaman destek alınmalı","Diş ve protez sorunları, ağız kuruluğu veya yutma güçlüğü yeterli beslenmeyi engelleyebilir. Yemek sırasında öksürme, boğulma hissi veya açıklanamayan kilo kaybı değerlendirilmelidir. Yemek sırasında öksürme, takılma, ıslak ses veya boğulma varsa değerlendirme isteyin. Yutma sorunu için kendi kendinize besin kıvamı değiştirmeyin."],["sarcopenia","Sarkopeni ve Kas Güçsüzlüğü","Kas gücünü korumak önemlidir","Güvenli ve kişiye uygun direnç egzersizleri, günlük hareket ve yeterli beslenme kas sağlığını destekleyebilir. Sandalyeden kalkmada zorlanma, yürüme hızında azalma veya tekrarlayan düşmeler varsa değerlendirme yaptırın. Egzersiz yoğunluğu hastalıklara ve düşme riskine göre uyarlanmalıdır."],["falls","Düşme ve Denge Bozuklukları","Belirtiler ve ne zaman destek alınmalı","Düşmeler, yaralanmaya ve bağımsızlık kaybına neden olabilir. İlaçlar, görme, kas gücü, denge, tansiyon ve ev içi riskler birlikte değerlendirilmelidir. Düşmelerin tarihini, koşullarını ve kullandığınız ilaçları not edin. Görme, ayakkabı, ev güvenliği, tansiyon ve dengeyi değerlendirtin."],["osteoporosis","Osteoporoz (Kemik Erimesi) ve Kırıklar","Kırık riskini değerlendirin","Düşük travmalı kırık öyküsü, boy kısalması, uzun süreli kortikosteroid kullanımı veya ebeveynde kalça kırığı öyküsü varsa hekiminizle kemik sağlığını görüşün. Dengeli beslenme, uygun yük taşıyan hareket ve düşmelerden korunma önemlidir. Test ve ilaç gereksinimi kişiselleştirilir."],["immobility","Hareketsizlik ve İşlev Kaybı","Belirtiler ve ne zaman destek alınmalı","Hastalık veya yatak istirahati sonrası günlük yaşam becerileri azalabilir. Güvenli erken hareket ve rehabilitasyon planı yararlı olabilir. Uzun yatak istirahatinden kaçının; güvenli hareket, fizyoterapi ve günlük yaşam etkinlikleri için destek alın."],["pressure","Bası Yaraları","Belirtiler ve ne zaman destek alınmalı","Uzun süre aynı pozisyonda kalma, hareketsizlik ve yetersiz beslenmeyle ilişkili doku hasarıdır. Cilt kontrolü ve basıncın azaltılması önemlidir. Hareket kısıtlılığı varsa cildi düzenli kontrol edin ve uygun basınç azaltma yöntemlerini bakım ekibinizle planlayın."],["sleep","Uyku Bozuklukları","Belirtiler ve ne zaman destek alınmalı","Uykusuzluk, uyku apnesi, huzursuz bacak ve gündüz uyuklama gibi sorunlar düşme, dikkat ve yaşam kalitesini etkileyebilir. Horlamayı, gece nefes durmasını, uykusuzluğu veya gündüz aşırı uyumayı sağlık ekibine bildirin."],["pain","Kronik Ağrı","Belirtiler ve ne zaman destek alınmalı","Süregelen ağrı hareketliliği, uykuyu ve ruh hâlini etkileyebilir. Ağrı nedeni ve tedavi riskleri birlikte değerlendirilmelidir. Ağrının yeri, süresi ve günlük yaşamı nasıl etkilediğini kaydedin. Ağrı kesicileri kendi kendinize çoğaltmayın."],["urinary","İdrar ve Dışkı Kaçırma","Konuşulabilir ve değerlendirilebilir bir durum","İdrar kaçırma yaşlanmanın kaçınılmaz bir sonucu değildir. Yakınmaların zamanı, sıklığı, eşlik eden yanma veya kabızlık gibi durumları not edin. Pelvik taban egzersizleri ve mesane eğitimi bazı kişilerde yararlı olabilir; uygun yaklaşımı sağlık profesyoneliyle belirleyin. İdrarda kan, ateş veya idrar yapamama durumunda gecikmeden değerlendirme gerekir."],["constipation","Kabızlık","Belirtiler ve ne zaman destek alınmalı","Hareketsizlik, yetersiz sıvı veya lif, ilaçlar ve bazı hastalıklar kabızlığa katkıda bulunabilir. Yeni veya ciddi belirtiler hekim tarafından değerlendirilmelidir. Dışkılama düzenini, ilaçları, hareketliliği ve sıvı alımını gözden geçirin. Kanama, şiddetli ağrı veya yeni belirti varsa başvurun."],["vision","Görme Problemleri","Belirtiler ve ne zaman destek alınmalı","Görme azalması günlük işleri ve düşme riskini etkileyebilir. Görme muayenesi, uygun gözlük ve katarakt gibi tedavi edilebilir nedenlerin değerlendirilmesi önemlidir. Görme azalması varsa göz muayenesi yaptırın; evde aydınlatmayı ve takılma tehlikelerini gözden geçirin."],["hearing","İşitme Problemleri","Belirtiler ve ne zaman destek alınmalı","İşitme kaybı iletişimi ve sosyal katılımı zorlaştırabilir. İşitme değerlendirmesi ve uygun yardımcı cihazlar yararlı olabilir. İşitme sorunları iletişimi zorluyorsa işitme testi ve uygun cihaz seçeneklerini değerlendirin."],["polypharmacy","Çoklu İlaç Kullanımı (Polifarmasi)","İlaç listenizi birlikte gözden geçirin","Reçeteli ilaçlarınız, reçetesiz ürünleriniz, vitamin ve bitkisel ürünlerinizi içeren güncel bir liste tutun. Baş dönmesi, düşme, uyku hali veya yeni bir belirti olduğunda ilaçlarınızı değerlendirmesi için hekime başvurun. İlaçları kendi kendinize kesmeyin veya değiştirmeyin."]],"self":"Kendinizi Değerlendirin","selfDesc":"FRAIL, SARC-F, GYA, EGYA ve GDS-15 taramaları","read":"İçeriği oku","close":"Bölümü kapat","footer":"Son güncelleme: Ekim 2026 · Taslak hasta eğitimi içeriği. Kurumsal klinik inceleme tamamlanmamıştır."},"en":{"title":"Health Guides for Patients and Caregivers","back":"← Home","intro":"Clear introductory information on common health issues in later life.","warning":"This is general educational information, not personalized diagnosis or treatment. Discuss medication changes with your clinician.","topics":[["dementia","Dementia and cognitive decline","Signs and when to seek help","Persistent problems with memory and daily functioning merit assessment; not all forgetfulness is dementia. Seek an assessment when memory difficulties affect daily life. Share changes in function and a medication list."],["delirium","Delirium","Signs and when to seek help","A sudden, fluctuating change in attention or awareness requires urgent medical assessment. A sudden change in attention or confusion needs urgent clinical assessment."],["depression","Depression and mental health","Emotional symptoms matter too","Ask for evaluation if persistent low mood, loss of interest or changes in sleep or appetite last more than two weeks. Depression is not a normal consequence of ageing, and treatments are available. If there is an immediate risk of self-harm, seek emergency assistance."],["frailty","Frailty","Signs and when to seek help","Reduced resilience to stressors, sometimes associated with weakness, slowness, fatigue and weight loss. Report weakness, slowness or unintended weight loss; discuss safe exercise and nutrition."],["malnutrition","Malnutrition","Signs and when to seek help","Unintended weight loss and insufficient intake may affect strength and health. Track unintended weight loss and seek help for poor appetite or food intake."],["swallowing","Chewing and Swallowing Difficulties","Signs and when to seek help","Dental problems, dry mouth or dysphagia may reduce food intake. Coughing or choking during meals needs assessment. Report coughing or choking during meals and seek a swallowing assessment."],["sarcopenia","Sarcopenia and weakness","Preserving muscle strength matters","Appropriate resistance exercise, regular movement and sufficient nutrition can help support muscle health. Difficulty rising from a chair, slower walking or repeated falls merit assessment. Activity should be tailored to your health and fall risk."],["falls","Falls and balance problems","Signs and when to seek help","Falls may lead to injury or loss of independence. Medicines, vision, balance, strength and home hazards should be reviewed. Record falls and review balance, vision, medicines and home hazards."],["osteoporosis","Osteoporosis and fractures","Understand your fracture risk","Discuss bone health if you have a low-trauma fracture, height loss, long-term corticosteroid exposure or a parent with a hip fracture. Balanced nutrition, suitable weight-bearing activity and fall prevention matter. Testing and medication decisions are individualized."],["immobility","Immobility and functional decline","Signs and when to seek help","Illness and inactivity may reduce independence; safe mobilisation and rehabilitation matter. Ask about safe mobilisation, rehabilitation and maintaining daily activities."],["pressure","Pressure injuries","Signs and when to seek help","Skin injury from prolonged pressure may be prevented with risk assessment and pressure relief. Review skin checks and pressure relief with the care team if mobility is limited."],["sleep","Sleep problems","Signs and when to seek help","Insomnia, sleep apnea and daytime sleepiness can affect wellbeing and function. Discuss insomnia, snoring, breathing pauses or daytime sleepiness with your clinician."],["pain","Chronic pain","Signs and when to seek help","Persistent pain may affect mobility, sleep and mood and merits individual assessment. Keep track of pain and how it affects daily life; review analgesics with a clinician."],["urinary","Urinary and fecal incontinence","A common concern that deserves evaluation","Incontinence is not an inevitable part of ageing. Note the frequency and circumstances of leakage, along with burning or constipation. Pelvic floor exercises and bladder training may help some people. Seek prompt evaluation for blood in urine, fever, or inability to pass urine."],["constipation","Constipation","Signs and when to seek help","Medicines, inactivity and illness can contribute; persistent or alarming symptoms need assessment. Review bowel habits, medicines and activity; seek care for bleeding or severe pain."],["vision","Vision Problems","Signs and when to seek help","Vision loss can affect daily tasks and safety. Eye assessment and correctable causes should be reviewed. Arrange an eye examination and improve lighting and home safety."],["hearing","Hearing Problems","Signs and when to seek help","Hearing loss can affect communication and social participation; testing and hearing aids may help. Seek hearing assessment and appropriate communication support."],["polypharmacy","Polypharmacy","Review your medication list together","Keep an updated list of prescriptions, over-the-counter products, vitamins and herbal products. Discuss new dizziness, falls, sleepiness or symptoms with a clinician. Do not stop or change medications independently."]],"self":"Try Self-assessment","selfDesc":"FRAIL, SARC-F, ADL, IADL and GDS-15 screening","read":"Read more","close":"Close topic","footer":"Updated October 2026 · Draft patient education content pending institutional clinical review."}};let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr";const $=x=>document.getElementById(x);const icons=["🧠","⚡","💬","🌿","🥣","🦷","💪","⚖️","🦴","🚶","🛏️","🌙","🩹","🚻","🥬","👁️","👂","💊"];function render(){document.documentElement.lang=lang;const t=d[lang];for(const id of ["title","back","intro","warning","self","selfDesc","footer"])$(id).textContent=t[id];$("nutritionTitle").textContent=lang==="tr"?"Beslenme Önerileri":"Nutrition Advice";$("nutritionDesc").textContent=lang==="tr"?"Genel sağlık, kas sağlığı ve kemik sağlığı için beslenme önerileri.":"Nutrition for general health, muscle and bone health.";$("nutritionLink").textContent=lang==="tr"?"Beslenme Önerilerini Oku →":"Read Nutrition Advice →";$("nutritionLink").href="beslenme-onerileri.html?lang="+lang;$("selfLink").textContent=t.self;$("selfLink").href="tools/self-assessment.html?lang="+lang;$("ministryTitle").textContent=lang==="tr"?"T.C. Sağlık Bakanlığı Kaynakları":"Turkish Ministry of Health Resources";$("resourcesTitle").textContent=lang==="tr"?"Yararlı Hasta Kaynakları":"Useful Patient Resources";$("resourcesDesc").textContent=lang==="tr"?"Osteoporoz ve kırıkların önlenmesi hakkında uluslararası hasta bilgilendirme kaynakları.":"International educational information on osteoporosis and fracture prevention.";$("topics").innerHTML=t.topics.map((x,i)=>'<section class="card" id="'+x[0]+'"><div class="icon" aria-hidden="true">'+icons[i]+'</div><h2>'+x[1]+'</h2><div class="summary">'+x[2]+'</div><details '+(location.hash==="#"+x[0]?"open":"")+'><summary>'+t.read+'</summary><p>'+x[3]+'</p></details></section>').join("");if(location.hash){const id=decodeURIComponent(location.hash.slice(1));requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView({block:"start"}))}} $("tr").onclick=()=>{lang="tr";render()};$("en").onclick=()=>{lang="en";render()};render();</script></body></html>
