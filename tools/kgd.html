<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KGD | İTF Geriatri</title><style>:root{font:18px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:#22382f;background:#f6f9f6}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:white;padding:22px max(22px,calc((100vw - 1020px)/2))}header h1{margin:8px 0 0;font-size:1.55rem}header a{color:white}.wrap{max-width:1020px;padding:20px;margin:auto}.warn{background:#fff1d3;color:#4c350c;border-left:5px solid #986608;padding:12px 16px}.panel{border:1px solid #d8e5dc;border-radius:13px;background:white;padding:22px;margin:17px 0}.section-head{font-size:1.22rem;margin:0 0 7px;color:#244d40}.item{padding:13px 0;border-bottom:1px solid #e4ece7}.item label{display:block;font-weight:650;margin-bottom:7px}.item select,.item input,.item textarea{min-height:44px;max-width:740px;width:100%;border:1px solid #819c89;border-radius:6px;padding:9px;background:white;font:inherit}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.btn{background:#285b4d;color:white;padding:12px 18px;min-height:48px;border:0;border-radius:7px;font:inherit;cursor:pointer}.btn.alt{background:#e4f0e7;color:#244e3e}.result{padding:13px 0;border-bottom:1px solid #dce9de}.result strong{font-size:1.1rem}.muted{color:#52675c;font-size:.86rem}.summary{border:2px solid #285b4d;padding:22px;background:#fff}.chip{display:inline-block;background:#e2f1e6;border-radius:6px;padding:3px 8px;font-size:.85rem}.noPrint{}.hidden{display:none}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bf8200;outline-offset:2px}@media(max-width:650px){.cols{grid-template-columns:1fr}}@media print{header,.noPrint,.warn,.panel.input{display:none!important}body{background:#fff}.wrap{padding:0;max-width:none}.summary{border:0;padding:0;font-size:12pt}.summary .result{break-inside:avoid}}.required{color:#b00020;font-weight:900;font-size:1.2em}.item.complete .required{display:none}.item select:invalid{border-color:#b00020}.item:has(select:not([value])) .required{display:inline}.choice-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}.choice-grid button{background:#fff;color:#244334;border:2px solid #879f8c;border-radius:9px;padding:11px 15px;min-height:48px;font:inherit;text-align:left;cursor:pointer}.choice-grid button[aria-pressed="true"]{background:#285b4d;color:#fff;border-color:#285b4d}.choice-grid:not(.binary) button{width:100%}.scored-select{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.hint{background:#e8f3ec;color:#244d3c;border:1px solid #9fbea8;border-radius:50%;font-weight:800;width:29px;height:29px;margin-left:8px;cursor:help}.required{color:#b00020}.item.complete .required{display:none}@media print{.choice-grid,.hint{display:none!important}}</style></head><body><header><a id="home" href="../index.html"></a><div style="float:right"><button class="btn alt" id="tr">TR</button> <button class="btn alt" id="en">EN</button></div><h1 id="title"></h1><div id="sub"></div></header><main class="wrap"><p class="warn" id="warning"></p><p id="intro"></p><div id="sections"></div><section class="panel input"><h2 id="measure"></h2><div class="cols" id="extras"></div><p class="muted" id="pnote"></p><div class="noPrint"><button class="btn" id="print"></button> <button class="btn alt" id="clear"></button></div></section><section class="panel summary" id="summary"></section></main><script>
const forms=[{"id":"adl","tr":"GYA — Günlük Yaşam Aktiviteleri","en":"ADL — Activities of Daily Living","max":6,"choices":[[1,"Bağımsız / Independent"],[0,"Yardım gerekli / Needs help"]],"items":["Banyo / Bathing","Giyinme / Dressing","Tuvalet / Toileting","Transfer / Transferring","Kontinans / Continence","Beslenme / Feeding"],"full":"6/6 = all measured basic activities independent"},{"id":"iadl","tr":"EGYA — Enstrümantal Günlük Yaşam Aktiviteleri","en":"IADL — Instrumental Activities","max":8,"choices":[[1,"Bağımsız / Independent"],[0,"Bağımlı / Dependent"]],"items":["Telefon / Telephone","Alışveriş / Shopping","Yemek hazırlama / Meal preparation","Ev temizliği / Housekeeping","Çamaşır / Laundry","Ulaşım / Transportation","İlaç yönetimi / Medication management","Mali işler / Finances"],"full":"8/8 = all measured instrumental activities independent"},{"id":"frail","tr":"FRAIL — Kırılganlık","en":"FRAIL — Frailty","max":5,"choices":[[0,"Hayır / No"],[1,"Evet / Yes"]],"items":["Yorgunluk / Fatigue","10 basamak merdiven çıkmada zorluk / Resistance","200 m yürümekte zorluk / Ambulation","11 hastalıktan 5’ten fazlası / Illnesses","Son yılda ≥%5 kilo kaybı / Weight loss"],"full":"0: robust, 1–2: prefrail, 3–5: frail"},{"id":"sarcf","tr":"SARC-F — Sarkopeni Taraması","en":"SARC-F — Sarcopenia screening","max":10,"choices":[[0,"Zorluk yok / None"],[1,"Biraz / Some"],[2,"Çok / Severe"]],"items":["5 kg kaldırma / Strength","Oda içinde yürüme / Walking","Sandalyeden kalkma / Chair transfer","10 basamak merdiven / Stairs","Son bir yılda düşme / Falls (0 none, 1 1–3, 2 ≥4)"],"full":"≥4: sarcopenia screening positive"},{"id":"sof","tr":"SOF — Kırılganlık","en":"SOF — Frailty criteria","max":3,"choices":[[0,"Hayır / No"],[1,"Evet / Yes"]],"items":["3 yılda ≥%5 kilo kaybı / Weight loss","5 kez otur-kalk yapamama / Unable to complete chair stands","Enerji dolu hissetmiyor / Low energy"],"full":"0 robust, 1 prefrail, 2–3 frail"},{"id":"mna","tr":"MNA-SF — Kısa Nütrisyonel Değerlendirme","en":"MNA-SF — Nutrition screening","max":14,"choices":null,"items":["Son 3 ay besin alımında azalma / Reduced food intake","Son 3 ay kilo kaybı / Weight loss","Mobilite / Mobility","Akut hastalık veya psikolojik stres / Acute illness or stress","Nöropsikolojik sorun / Neuropsychological problems","BKİ veya baldır çevresi puanı / BMI or calf score"],"options":[[[0,"Ciddi / Severe"],[1,"Orta / Moderate"],[2,"Yok / None"]],[[0,">3 kg"],[1,"Bilinmiyor / Unknown"],[2,"1–3 kg"],[3,"Yok / None"]],[[0,"Yatağa / sandalyeye bağımlı"],[1,"Ev dışına çıkamıyor"],[2,"Dışarı çıkabiliyor"]],[[0,"Evet / Yes"],[2,"Hayır / No"]],[[0,"Ciddi / Severe"],[1,"Hafif / Mild"],[2,"Yok / None"]],[[0,"BMI <19 / CC <31 cm"],[1,"BMI 19–<21"],[2,"BMI 21–<23"],[3,"BMI ≥23 / CC ≥31 cm"]]],"full":"0–7 malnutrition, 8–11 risk, 12–14 normal"}],texts={"tr":{"title":"Kapsamlı Geriatrik Değerlendirme","sub":"İTF KGD formu · Dijital çalışma prototipi","home":"← Ana sayfa","warning":"Yalnızca eğitim / demo amaçlıdır. GitHub Pages güvenli hasta kayıt sistemi değildir: ad, TC kimlik numarası, telefon veya tanımlanabilir klinik veri girmeyiniz. Girdi sunucuya gönderilmez; sayfa yenilenince silinir.","intro":"Bu ilk sürüm formun seçilmiş puanlanan alanlarını dijitalleştirir: GYA, EGYA, FRAIL, SARC-F, SOF ve MNA-SF. Diğer alanlar için özet girişleri vardır. Tam 8 sayfalık KGD formunun yerini henüz almaz.","details":"Anonim değerlendirme notları","measure":"Diğer ölçümler ve klinik değerlendirme","print":"Hasta için özet hazırla / Yazdır","clear":"Sıfırla","summary":"Kapsamlı Geriatrik Değerlendirme Özeti","date":"Tarih","completed":"Tamamlanan testler","missing":"Eksik testler","domains":"Ölçekte zorlanılan alanlar","meaning":"Yorum","none":"Belirtilen alanlarda puan kaybı yok.","incomplete":"Eksik — sonuç hesaplanmadı","general":"Bu özet tanı koymaz ve hekim değerlendirmesinin yerini almaz. Hasta ile paylaşılmadan önce tüm veriler ve yorumlar klinisyen tarafından kontrol edilmelidir.","pnote":"Hastanın adı veya kimlik numarası bu taslak sistemde istenmez. Rapor yazdırılırken tarayıcı yazdırma penceresinden yerel PDF seçilebilir.","labels":["Boy (cm)","Kilo (kg)","El kavrama (kg)","Yürüme hızı (m/sn)","TUG (sn)","SPPB (/12)","Chair stand (sn)","MMSE (/30)","GDS (/30)","Saat çizme (/5)","İlaç sayısı","Kısa klinik not (tanımlayıcı bilgi kullanmayın)"]},"en":{"title":"Comprehensive Geriatric Assessment","sub":"ITF CGA form · Digital prototype","home":"← Home","warning":"Educational demonstration only. GitHub Pages is not a secure medical record: do not enter names, national identifiers, phone numbers or identifiable health information. Nothing is uploaded or saved, and refreshing clears entries.","intro":"This first version digitizes selected scored domains of the form: ADL, IADL, FRAIL, SARC-F, SOF and MNA-SF. Additional measurements can be noted. This is not yet a replacement for the complete eight-page CGA.","details":"Anonymous assessment notes","measure":"Other clinical measurements","print":"Prepare patient summary / Print","clear":"Clear","summary":"Comprehensive Geriatric Assessment Summary","date":"Date","completed":"Completed scales","missing":"Incomplete scales","domains":"Areas with score reductions","meaning":"Interpretation","none":"No lost points in recorded domains.","incomplete":"Incomplete — not scored","general":"This summary does not establish a diagnosis or replace clinical assessment. A clinician must verify the data and interpretation before sharing with a patient.","pnote":"This prototype does not ask for names or identifiers. Use your browser’s local Print to PDF option for a report.","labels":["Height (cm)","Weight (kg)","Handgrip (kg)","Gait speed (m/s)","TUG (s)","SPPB (/12)","Chair stand (s)","MMSE (/30)","GDS (/30)","Clock drawing (/5)","Medication count","Brief clinical notes (no identifiers)"]}};let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr";const $=id=>document.getElementById(id);
const extraIds=["height","weight","hgs","gait","tug","sppb","chair","mmse","gds","clock","meds","notes"];
function safe(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function render(){const t=texts[lang];document.documentElement.lang=lang;for(const k of ["home","title","sub","warning","intro","measure","pnote","print","clear"])$(k).textContent=t[k];$("extras").innerHTML=t.labels.map((label,i)=>'<div class="item"><label for="extra_'+extraIds[i]+'">'+safe(label)+'</label>'+(i===11?'<textarea id="extra_'+extraIds[i]+'" rows="3"></textarea>':'<input type="number" step="any" min="0" id="extra_'+extraIds[i]+'">')+'</div>').join("");
$("sections").innerHTML=forms.map(s=>'<section class="panel input" id="form_'+s.id+'"><h2 class="section-head">'+safe(lang==="tr"?s.tr:s.en)+'</h2><p class="muted">'+safe(s.full)+'</p>'+s.items.map((item,i)=>'<div class="item"><label for="'+s.id+'_'+i+'">'+(i+1)+'. '+safe(item)+' <span class="required" aria-label="zorunlu">*</span><button type="button" class="hint" title="Puanlar yanıtların yanında gösterilir. Eksik yanıtlar puanlanmaz." aria-label="Puanlama bilgisi">i</button></label><select id="'+s.id+'_'+i+'"><option value="">— '+(lang==="tr"?"Seçiniz":"Select")+' —</option>'+(s.options?s.options[i]:s.choices).map(([v,name])=>'<option value="'+v+'">'+v+' — '+safe(name)+'</option>').join("")+'</select></div>').join("")+'</section>').join("");enhanceChoices();document.querySelectorAll("#extras input,#extras textarea").forEach(x=>x.addEventListener("input",summarize));summarize();}
function enhanceChoices(){document.querySelectorAll("#sections select").forEach(sel=>{let host=sel.parentElement,old=host.querySelector(".choice-grid");if(old)old.remove();sel.classList.add("scored-select");const grid=document.createElement("div");grid.className="choice-grid"+(sel.options.length===3?" binary":"");grid.setAttribute("role","group");grid.setAttribute("aria-label",host.querySelector("label")?.textContent||"Yanıt seçenekleri");for(const opt of [...sel.options].slice(1)){const btn=document.createElement("button");btn.type="button";btn.textContent=opt.textContent;btn.dataset.value=opt.value;btn.setAttribute("aria-pressed",String(sel.value===opt.value&&sel.value!==""));btn.onclick=()=>{sel.value=opt.value;grid.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===btn)));host.classList.add("complete");summarize()};grid.appendChild(btn)}sel.after(grid);host.classList.toggle("complete",sel.value!=="")})}
function meaning(s,score){if(s.id==="frail")return score===0?"Normal / Robust":score<3?"Pre-frail":"Frail";if(s.id==="mna")return score<=7?"Malnütrisyon / Malnutrition":score<=11?"Risk / At risk":"Normal";if(s.id==="sarcf")return score>=4?"Pozitif tarama / Positive screen":"Negatif tarama / Negative screen";if(s.id==="sof")return score===0?"Robust":score===1?"Pre-frail":"Frail";if(s.id==="adl"||s.id==="iadl")return score===s.max?"Bağımsız / Independent":"Bazı alanlarda yardım ihtiyacı / Assistance in some domains";return""}
function summarize(){const t=texts[lang],lost=[];let complete=0;let out='<h2>'+safe(t.summary)+'</h2><p class="muted">'+safe(t.date)+': '+new Date().toLocaleDateString(lang==="tr"?"tr-TR":"en-GB")+'</p>';for(const s of forms){const vals=s.items.map((_,i)=>$(s.id+"_"+i).value);const ready=vals.every(v=>v!=="");if(ready)complete++;const score=ready?vals.reduce((n,v)=>n+Number(v),0):null;out+='<div class="result"><strong>'+safe(lang==="tr"?s.tr:s.en)+': '+(ready?score+" / "+s.max:safe(t.incomplete))+'</strong>';if(ready){out+='<div>'+safe(t.meaning)+': '+safe(meaning(s,score))+'</div>';const lostHere=[];s.items.forEach((it,i)=>{let val=+vals[i];const deficit=(s.id==="adl"||s.id==="iadl"||s.id==="mna")?val<(s.id==="mna"?[2,3,2,2,2,3][i]:1):val>0;if(deficit)lostHere.push(it)});out+='<p class="muted">'+safe(t.domains)+': '+safe(lostHere.length?lostHere.join("; "):t.none)+'</p>'}out+='</div>';}
out+='<p><strong>'+safe(t.completed)+': '+complete+'/'+forms.length+'</strong></p>';let other=[];extraIds.forEach((id,i)=>{const x=$("extra_"+id).value.trim();if(x!=="")other.push(safe(t.labels[i])+": "+safe(x))});if(other.length)out+='<h3>'+safe(t.measure)+'</h3><p>'+other.join("<br>")+'</p>';out+='<p class="muted">'+safe(t.general)+'</p>';$("summary").innerHTML=out;}
function switchLang(v){const values={};document.querySelectorAll("input,textarea,select").forEach(x=>values[x.id]=x.value);lang=v;render();for(const [id,val] of Object.entries(values)){if($(id))$(id).value=val}enhanceChoices();summarize()}
$("tr").onclick=()=>switchLang("tr");$("en").onclick=()=>switchLang("en");$("print").onclick=()=>{summarize();window.print()};$("clear").onclick=()=>{if(confirm(lang==="tr"?"Tüm yanıtlar silinsin mi?":"Clear all answers?")){render();window.scrollTo(0,0)}};render();
</script></body></html>
