function simpleQuestion(key,q,options){return '<div class="extra-field"><label>'+safe(q)+' <span class="redstar">*</span></label><div class="simple-choice">'+options.map(([t,v])=>'<button type="button" data-key="'+key+'" data-value="'+v+'" aria-pressed="'+(moreAnswers[key]===String(v))+'">'+safe(t)+'</button>').join("")+'</div></div>'}
function moreScore(prefix,count){let v=Array.from({length:count},(_,i)=>moreAnswers[prefix+i]);return v.some(x=>x===undefined)?null:v.reduce((n,x)=>n+Number(x),0)}
function emailOnly(){const scores=[];for(const q of forms){let values=q.items.map((_,i)=>$(q.id+"_"+i)?.value||"");if(values.every(x=>x!==""))scores.push(q.tr+": "+values.reduce((a,x)=>a+Number(x),0)+"/"+q.max)}const gd=gdsScore();if(gd!==null)scores.push("GDS-30: "+gd+"/30");if(!confirm("Sadece anonim toplam puanlarla e-posta uygulaması açılsın mı? Hasta kimliği, notları ve cevaplar eklenmez."))return;const href="mailto:itfgeriatri2000@gmail.com?subject="+encodeURIComponent("Anonim KGD puan özeti")+"&body="+encodeURIComponent(scores.join("\n")||"Tamamlanan ölçek bulunmuyor");location.href=href}
function gdsScore(){const arr=Array.from({length:30},(_,i)=>moreAnswers["gds30_"+i]);if(arr.some(x=>x===undefined))return null;const reverse=new Set([0,4,6,10,12,15,21,26,28,29]);return arr.reduce((n,v,i)=>n+(reverse.has(i)?(v==="0"?1:0):(v==="1"?1:0)),0)}
function meaning(s,score){if(s.id==="frail")return score===0?"Normal / Robust":score<3?"Pre-frail":"Frail";if(s.id==="mna")return score<=7?"Malnütrisyon / Malnutrition":score<=11?"Risk / At risk":"Normal";if(s.id==="sarcf")return score>=4?"Pozitif tarama / Positive screen":"Negatif tarama / Negative screen";if(s.id==="sof")return score===0?"Robust":score===1?"Pre-frail":"Frail";if(s.id==="adl"||s.id==="iadl")return score===s.max?"Bağımsız / Independent":"Bazı alanlarda yardım ihtiyacı / Assistance in some domains";return""}
function summarize(){const t=texts[lang],lost=[];let complete=0;let out='<h2>'+safe(t.summary)+'</h2><p class="muted">'+safe(t.date)+': '+new Date().toLocaleDateString(lang==="tr"?"tr-TR":"en-GB")+'</p>';for(const s of forms){const vals=s.items.map((_,i)=>$(s.id+"_"+i).value);const ready=vals.every(v=>v!=="");if(ready)complete++;const score=ready?vals.reduce((n,v)=>n+Number(v),0):null;out+='<div class="result"><strong>'+safe(lang==="tr"?s.tr:s.en)+': '+(ready?score+" / "+s.max:safe(t.incomplete))+'</strong>';if(ready){out+='<div>'+safe(t.meaning)+': '+safe(meaning(s,score))+'</div>';const lostHere=[];s.items.forEach((it,i)=>{let val=+vals[i];const deficit=(s.id==="adl"||s.id==="iadl"||s.id==="mna")?val<(s.id==="mna"?[2,3,2,2,2,3][i]:1):val>0;if(deficit)lostHere.push(it)});out+='<p class="muted">'+safe(t.domains)+': '+safe(lostHere.length?lostHere.join("; "):t.none)+'</p>'}out+='</div>';}
out+='<p><strong>'+safe(t.completed)+': '+complete+'/'+forms.length+'</strong></p>';out+='<p class="muted">'+safe(t.general)+'</p>';addInlineScores();document.querySelectorAll("#extraScales > section,#fullGds > section").forEach(sec=>{let output=sec.querySelector(".inline-score");if(!output){output=document.createElement("div");output.className="inline-score";sec.appendChild(output)}let keys=[];if(sec.id==="clock-assessment"){output.textContent="Saat Çizme: "+(moreAnswers.clock??"Eksik")+" / 5";return}if(sec.id==="mmse-assessment"){keys=Array.from({length:30},(_,i)=>"mmse_"+mmseVariant+"_"+i)}else if(sec.parentElement.id==="fullGds"){keys=Array.from({length:30},(_,i)=>"gds30_"+i)}else{const j=[...sec.parentElement.children].indexOf(sec);keys=additional[j]?.[1].map((_,i)=>"additional_"+j+"_"+i)||[]}const done=keys.filter(k=>moreAnswers[k]!==undefined).length;output.textContent="Bölüm: "+(done===keys.length?sec.parentElement.id==="fullGds"?gdsScore()+"/30":keys.reduce((a,k)=>a+Number(moreAnswers[k]),0).toFixed(1):"Eksik "+done+"/"+keys.length)});const c=moreAnswers.clock;out+='<div class="result"><strong>Saat Çizme Testi: '+(c===undefined?"Eksik":c+"/5")+'</strong></div>';const mm=Array.from({length:30},(_,i)=>moreAnswers["mmse_"+mmseVariant+"_"+i]);out+='<div class="result"><strong>MMSE ('+(mmseVariant==="standard"?"Standart":"Eğitimsiz")+ '): '+(mm.some(v=>v===undefined)?"Eksik":mm.reduce((a,b)=>a+Number(b),0)+"/30")+'</strong></div>';const gd=gdsScore();out+='<div class="result"><strong>GDS-30: '+(gd===null?"Eksik — sonuç hesaplanmadı":gd+"/30")+'</strong></div>';$("summary").innerHTML=out;}
function switchLang(v){const values={};document.querySelectorAll("input,textarea,select").forEach(x=>values[x.id]=x.value);lang=v;render();for(const [id,val] of Object.entries(values)){if($(id))$(id).value=val}enhanceChoices();fullRender();summarize()}
$("printFinal").onclick=()=>{summarize();window.print()};$("emailFinal").onclick=emailOnly;render();fullRender();
</script></body></html>
