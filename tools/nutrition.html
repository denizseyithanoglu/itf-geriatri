<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutrition | İTF Geriatri</title><style>:root{font:18px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:#22372e;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:#fff;padding:24px max(22px,calc((100vw - 1070px)/2))}header h1{font-size:1.55rem;margin:0}header a{color:#fff}main{max-width:1070px;margin:auto;padding:20px}.panel{background:white;border:1px solid #d4e3da;border-radius:12px;padding:21px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{margin:9px 0}.field label{display:block;font-weight:650;margin-bottom:5px}.field input,.field select{width:100%;font:inherit;padding:10px;border:1px solid #708c7b;border-radius:7px;min-height:45px}.button{border:0;border-radius:7px;background:#285b4d;color:white;padding:11px 16px;font-weight:750;font:inherit;cursor:pointer}.button.alt{background:#dfede2;color:#24463d}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.metric{background:#eff6f0;padding:13px;border-radius:10px}.metric strong{display:block;font-size:1.5rem}.warning{background:#fff0cf;border-left:4px solid #a06a00;padding:12px;color:#523a0d}.mini{font-size:.84rem;color:#526359}.rec{border:1px solid #d4e3da;padding:13px;border-radius:9px;margin:10px 0}.bar{height:10px;background:#dbe8df;border-radius:10px;overflow:hidden;margin:5px 0}.bar span{display:block;background:#285b4d;height:100%}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid orange;outline-offset:2px}@media(max-width:600px){.grid,.metrics{grid-template-columns:1fr}}@media print{header,.noprint{display:none}body{background:white}.panel{break-inside:avoid}}header{background:#173b5d}.button,button:not(.alt):not(.secondary){background:#234d71}.metric{background:#eef4fa}.bar span{background:#285b86}a{color:#234d71}@media(max-width:650px){main{padding:12px}.panel{padding:14px}}.entry-grid{display:grid;grid-template-columns:90px 1.6fr 1fr 1fr 1fr;gap:12px}.entry-grid .pal,.entry-grid .protein,.entry-grid .intake,.entry-grid .intakep{grid-column:span 2}.entry-grid .bmi output{display:block;min-height:46px;padding:10px;background:#e8f2f9;border-radius:8px;font-weight:700}@media(max-width:750px){.entry-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.entry-grid .pal,.entry-grid .protein,.entry-grid .intake,.entry-grid .intakep{grid-column:span 2}}.gender-buttons{display:flex;gap:5px}.gender-buttons button{min-height:44px;background:#f0f5fa;border:1px solid #9eb9ca;border-radius:6px;padding:7px;color:#173b5d;cursor:pointer}.gender-buttons button[aria-pressed="true"]{background:#234d71;color:white}.entry-grid .sex select{position:absolute;opacity:0;pointer-events:none;width:1px}.results-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:15px}.calorie-card{padding:12px;background:#eef4fa;border-radius:7px;margin:6px 0}.calorie-card strong{display:block;font-size:1.2rem}@media(max-width:720px){.results-grid{grid-template-columns:1fr}}</style></head><body><header><a id="back" href="../index.html"></a><div style="float:right"><button id="tr" class="button alt" type="button">TR</button> <button id="en" class="button alt" type="button">EN</button></div><h1 id="title"></h1><div id="sub"></div></header><main><p class="warning" id="warn"></p><section class="panel"><div class="entry-grid"><div class="field age"><label id="l_age" for="age"></label><input id="age" type="number" min="0" step="any" value="75"></div><div class="field sex"><label id="l_sex" for="sex"></label><select id="sex"></select><div class="gender-buttons"><button type="button" id="femaleButton">♀ Kadın</button><button type="button" id="maleButton">♂ Erkek</button></div></div><div class="field height"><label id="l_height" for="height"></label><input id="height" type="number" min="0" step="any" value="165"></div><div class="field weight"><label id="l_weight" for="weight"></label><input id="weight" type="number" min="0" step="any" value="65"></div><div class="field bmi"><label id="l_bmi" for="bmi"></label><output id="bmiOutput">—</output></div><div class="field pal"><label id="l_pal" for="pal"></label><select id="pal"></select></div><div class="field protein"><label id="l_protein" for="protein"></label><select id="protein"></select></div><div class="field intake"><label id="l_intake" for="intake"></label><input id="intake" type="number" min="0" step="any" value=""></div><div class="field intakep"><label id="l_intakep" for="intakep"></label><input id="intakep" type="number" min="0" step="any" value=""></div></div><div class="noprint"><button class="button" id="calc"></button> <button class="button alt" id="print"></button> <button class="button alt" id="reset"></button></div></section><section class="panel"><h2 id="resultTitle"></h2><div class="results-grid"><div id="metrics"></div><div id="proteinResult"></div></div><div id="error" class="warning" hidden></div><div id="comparison"></div></section><section class="panel"><h2 id="supp"></h2><div class="grid"><div class="field"><label id="l_method" for="method"></label><select id="method"><option value="ger">ESPEN 30 kcal/kg</option><option value="inp">ESPEN 27 kcal/kg</option><option value="tee">Harris–Benedict × PAL</option></select></div><div class="field"><label id="l_cat" for="cat"></label><select id="cat"></select></div><div class="field"><label id="l_units" for="units"></label><select id="units"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div></div><div id="suggestions"></div><p class="mini" id="source"></p><p class="warning" id="caution"></p></section></main><script>
const d={"tr":{"title":"Klinik Beslenme Hesaplayıcı","sub":"Revize Harris–Benedict, ESPEN ve oral nütrisyon ürünleri","back":"← Ana sayfa","warn":"Geliştirme prototipi: Tanımlanabilir hasta verisi girmeyiniz. Sonuçlar tarayıcıda hesaplanır, kaydedilmez.","age":"Yaş","sex":"Denklem için cinsiyet","female":"Kadın","male":"Erkek","weight":"Kilo (kg)","height":"Boy (cm)","pal":"Fiziksel aktivite düzeyi (PAL)","protein":"Protein hedefi (g/kg/gün)","intake":"Günlük enerji alımı (kcal)","intakep":"Günlük protein alımı (g)","method":"Hedef seçimi","cat":"Ürün grubu","units":"Azami ünite/gün","calculate":"Hesapla","print":"Yazdır / PDF","reset":"Temizle","bmr":"Bazal metabolizma (Harris–Benedict)","tee":"Harris–Benedict × PAL","ger":"ESPEN geriatri 30 kcal/kg","inp":"ESPEN çoklu hastalığı olan yatan hasta ≥65: 27 kcal/kg","prot":"Günlük protein hedefi","gap":"Eksik enerji / protein","supp":"Sayısal oral destek seçenekleri","nodata":"Ürün eşleştirmesi için günlük enerji ve protein alımını giriniz.","caution":"Liste klinik reçete değildir. Yutma güvenliği, böbrek fonksiyonu, diyabet, alerjiler, reflü, tolerans, yeniden beslenme riski ve güncel ürün etiketlerini kontrol ediniz. Özel formüller uzman değerlendirmesi gerektirir.","unitsLabel":"ünite/gün","remaining":"Kalan açık","error":"Geçerli hasta ölçümlerini ve PAL değerini giriniz.","source":"Kaynak: Yüklediğiniz Türkiye oral nütrisyon ürün kataloğundaki sayısal veriler. Güncel içerik/erişilebilirlik doğrulanmalıdır."},"en":{"title":"Clinical Nutrition Calculator","sub":"Revised Harris–Benedict, ESPEN and oral nutrition options","back":"← Home","warn":"Development prototype: Do not enter identifiable patient information. Calculations run in your browser without saving data.","age":"Age","sex":"Sex for equation","female":"Female","male":"Male","weight":"Weight (kg)","height":"Height (cm)","pal":"Physical activity level (PAL)","protein":"Protein target (g/kg/day)","intake":"Daily calorie intake (kcal)","intakep":"Daily protein intake (g)","method":"Energy target","cat":"Product category","units":"Maximum units/day","calculate":"Calculate","print":"Print / PDF","reset":"Reset","bmr":"Basal metabolic rate (Harris–Benedict)","tee":"Harris–Benedict × PAL","ger":"ESPEN geriatrics 30 kcal/kg","inp":"ESPEN polymorbid inpatient ≥65: 27 kcal/kg","prot":"Daily protein target","gap":"Energy / protein shortfall","supp":"Numerically matched oral supplements","nodata":"Enter actual daily kcal and protein intake to generate matches.","caution":"These are not prescriptions. Assess swallowing safety, renal function, diabetes, allergies, tolerance, refeeding risk and up-to-date product labels. Specialist formulations require clinical review.","unitsLabel":"units/day","remaining":"Remaining gap","error":"Enter valid measurements and PAL.","source":"Source: your uploaded Turkish oral nutrition catalogue; current labels and availability require verification."}},raw="General|Ensure 250 mL|250|10|250\nGeneral|Ensure Plus 220 mL|330|13.75|220\nFibre|Ensure Plus Fiber 200 mL|300|12.5|200\nCompact|Ensure Compact 125 mL|300|16|125\nCompact|Ensure 2 Cal 200 mL|400|16.8|200\nMuscle|Nutrivigor 220 mL|330|20.02|220\nDiabetes|Glucerna SR 220 mL|198|9.9|220\nDiabetes|Glucerna Advance 1.6 220 mL|352|18.04|220\nRenal|Nepro HP 500 mL|900|40.5|500\nGeneral|Fortimel Drink 200 mL|300|12|200\nGeneral|Fortimel Energy 200 mL|300|11.8|200\nFibre|Fortimel Energy Multi Fibre 200 mL|300|11.8|200\nCompact|Fortimel Compact Protein 125 mL|300|18|125\nFibre|Fortimel Compact Fibre 125 mL|300|12|125\nMuscle|Fortimel Advanced 200 mL|300|21|200\nDiabetes|Diasip 200 mL|200|9.8|200\nWound|Cubitan 200 mL|248|17.6|200\nOncology|Fortimel FortiCare 125 mL|300|18.25|125\nGeneral|Resource 2.0 200 mL|400|18|200\nFibre|Resource 2.0 Fibre 200 mL|400|18|200\nMuscle|Resource Protein 200 mL|250|18|200\nGeneral|Fresubin 2 kcal Drink 200 mL|400|20|200\nFibre|Fresubin 2 kcal Fibre Drink 200 mL|400|20|200";const products=raw.trim().split("\n").map(s=>{let [c,n,k,p,ml]=s.split("|");return{c,n,k:+k,p:+p,ml:+ml}});const $=x=>document.getElementById(x);let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr";const fmt=x=>Math.round(x).toLocaleString(lang==="tr"?"tr-TR":"en-US");function txt(){const t=d[lang];document.documentElement.lang=lang;for(const k of ["title","sub","back","warn","supp","source","caution","error"])$(k).textContent=t[k];for(const k of ["age","sex","weight","height","pal","protein","intake","intakep","method","cat","units"])$("l_"+k).textContent=t[k];$("resultTitle").textContent=lang==="tr"?"Hesaplama sonuçları":"Calculation results";$("calc").textContent=t.calculate;$("print").textContent=t.print;$("reset").textContent=t.reset;$("sex").innerHTML='<option value="f">'+t.female+'</option><option value="m">'+t.male+'</option>';$("pal").innerHTML=[1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,2.0].map(v=>'<option value="'+v+'" '+(v===1.2?'selected':'')+'>'+v.toFixed(1)+'</option>').join("");$("protein").innerHTML=['1,1.2','1.2,1.5','1,1','0.8,0.8'].map(v=>'<option value="'+v+'" '+(v==='1.2,1.5'?'selected':'')+'>'+v.replace(",","–")+' g/kg</option>').join("");$("cat").innerHTML='<option value="all">'+(lang==="tr"?"Tüm oral ürünler":"All oral products")+'</option>'+[...new Set(products.map(p=>p.c))].map(c=>'<option>'+c+'</option>').join("");}
function update(){$("femaleButton").setAttribute("aria-pressed",String($("sex").value==="f"));$("maleButton").setAttribute("aria-pressed",String($("sex").value==="m"));const t=d[lang],age=+$("age").value,w=+$("weight").value,h=+$("height").value,pal=+$("pal").value;const ok=age>=18&&age<=120&&w>0&&w<=400&&h>=70&&h<=240&&pal>=1;if(!ok){$("error").hidden=false;$("metrics").innerHTML="";$("proteinResult").innerHTML="";$("bmiOutput").textContent="—";$("suggestions").innerHTML="";return}$("error").hidden=true;const bmr=$("sex").value==="m"?88.362+13.397*w+4.799*h-5.677*age:447.593+9.247*w+3.098*h-4.33*age;const v={bmr,tee:bmr*pal,ger:30*w,inp:27*w};const pr=$("protein").value.split(",").map(Number);let pmin=pr[0]*w,pmax=pr[1]*w;const metrics=[[t.bmr,v.bmr],[t.tee,v.tee],[t.ger,v.ger],[t.inp,v.inp]];$("metrics").innerHTML=metrics.map(([name,value])=>'<div class="calorie-card"><span>'+name+'</span><strong>'+fmt(value)+' kcal/gün</strong></div>').join("");$("proteinResult").innerHTML='<div class="metric"><span>'+t.prot+'</span><strong>'+fmt(pmin)+"–"+fmt(pmax)+' g/gün</strong></div>';$("bmiOutput").textContent=(w/(h/100)**2).toFixed(1);$("comparison").innerHTML=[["HB × PAL",v.tee],["ESPEN 30",v.ger],["ESPEN 27",v.inp]].map(([name,x])=>'<div>'+name+': '+fmt(x)+' kcal<div class="bar"><span style="width:'+Math.min(100,x/Math.max(v.tee,v.ger,v.inp)*100)+'%"></span></div></div>').join("");const ie=$("intake").value,ip=$("intakep").value;if(ie===""||ip===""||+ie<0||+ip<0){$("suggestions").textContent=t.nodata;return}const kgap=Math.max(0,v[$("method").value]-(+ie)),pgap=Math.max(0,pmin-(+ip));if(!kgap&&!pgap){$("suggestions").textContent=lang==="tr"?"Seçilen hedefler karşılanıyor.":"Selected targets are met.";return}const max=+$("units").value,cat=$("cat").value;let options=[];for(const q of products){if(cat!=="all"&&cat!==q.c)continue;for(let n=1;n<=max;n++){const k=q.k*n,p=q.p*n;options.push({q,n,k,p,score:Math.abs(k-kgap)/Math.max(300,kgap)+1.3*Math.abs(p-pgap)/Math.max(15,pgap)+n*.035})}}options.sort((a,b)=>a.score-b.score);let seen=new Set,top=[];for(const z of options){if(!seen.has(z.q.n)){top.push(z);seen.add(z.q.n)}if(top.length===5)break}$("suggestions").innerHTML='<p><b>'+t.gap+': '+fmt(kgap)+' kcal / '+pgap.toFixed(1)+' g</b></p>'+top.map(z=>'<div class="rec"><strong>'+z.q.n+'</strong><div>'+z.n+' '+t.unitsLabel+' → '+fmt(z.k)+' kcal · '+z.p.toFixed(1)+' g · '+(z.n*z.q.ml)+' mL</div><small>'+t.remaining+': '+fmt(Math.max(0,kgap-z.k))+' kcal / '+Math.max(0,pgap-z.p).toFixed(1)+' g</small></div>').join("");}
$("femaleButton").onclick=()=>{$("sex").value="f";update()};$("maleButton").onclick=()=>{$("sex").value="m";update()};for(const id of ["age","sex","weight","height","pal","protein","intake","intakep","method","cat","units"])$(id).addEventListener("change",update);for(const id of ["age","weight","height","intake","intakep"])$(id).addEventListener("input",update);$("tr").onclick=()=>{let x=$("sex").value,p=$("pal").value,q=$("protein").value,c=$("cat").value;lang="tr";txt();$("sex").value=x;$("pal").value=p;$("protein").value=q;$("cat").value=c;update()};$("en").onclick=()=>{let x=$("sex").value,p=$("pal").value,q=$("protein").value,c=$("cat").value;lang="en";txt();$("sex").value=x;$("pal").value=p;$("protein").value=q;$("cat").value=c;update()};$("calc").onclick=update;$("print").onclick=()=>window.print();$("reset").onclick=()=>{for(const id of ["age","weight","height","intake","intakep"])$(id).value=({age:75,weight:65,height:165})[id]??"";$("sex").value="f";$("pal").value="1.2";$("protein").value="1.2,1.5";update()};txt();update();
</script></body></html>
