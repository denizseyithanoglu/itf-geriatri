<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kendinizi Değerlendirin | İTF Geriatri</title><style>:root{font:18px/1.6 system-ui,sans-serif;color:#263b30;background:#f5f9f5}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:#fff;padding:24px max(22px,calc((100vw - 840px)/2))}header a{color:white}.wrap{max-width:840px;padding:22px;margin:auto}.warning{background:#fff1d2;border-left:5px solid #af842e;padding:14px}.panel{background:white;border:1px solid #d7e7dc;border-radius:12px;padding:22px;margin:18px 0}.question{border-bottom:1px solid #e0e9e2;padding:13px 0}.question legend{font-weight:650;padding-bottom:8px}fieldset{border:0;margin:0;padding:0}label{margin-right:22px;display:inline-block;padding:6px 0}input{width:20px;height:20px;vertical-align:middle}.button{background:#285b4d;border:0;border-radius:6px;color:#fff;padding:12px 18px;font:inherit;cursor:pointer}.button.alt{background:#e1eee4;color:#1e4737}.result{border-left:5px solid #285b4d;padding:16px;background:#ebf4ed;margin:16px 0}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #b67e00;outline-offset:2px}@media print{header,.buttons,.warning{display:none}}</style></head><body><header><a href="../index.html" id="back"></a><div style="float:right"><button class="button alt" id="tr">TR</button> <button class="button alt" id="en">EN</button></div><h1 id="title"></h1></header><main class="wrap"><p class="warning" id="warning"></p><div class="panel"><h2 id="frail"></h2><p id="intro"></p><div id="questions"></div><div class="buttons"><button class="button" id="score"></button> <button class="button alt" id="reset"></button></div><div class="result" id="result" aria-live="polite"></div></div><p id="disclaimer"></p></main><script>
const t={tr:{back:"← Ana sayfa",title:"Kendinizi Değerlendirin",warning:"Bu test tanı koymaz. Ciddi yakınmalarınız için hekim değerlendirmesi gerekir. Yanıtlar sadece bu tarayıcıda hesaplanır ve saklanmaz; kimlik bilgisi girmeyiniz.",frail:"FRAIL — Kırılganlık Ön Taraması",intro:"Son durumunuza uygun yanıtı seçiniz. Beş sorunun tamamı yanıtlanmalıdır.",q:["Son 4 haftanın çoğunda kendinizi yorgun hissettiniz mi?","Yardım almadan 10 basamak merdiven çıkmakta zorlanıyor musunuz?","Yardım almadan yaklaşık 200 metre yürümekte zorlanıyor musunuz?","Hipertansiyon, diyabet, KOAH, kalp krizi, kalp yetersizliği, anjina, astım, artrit, inme, böbrek hastalığı ve kanserden 5'ten fazlası var mı?","Son 1 yıl içinde istemsiz olarak vücut ağırlığınızın en az %5'ini kaybettiniz mi?"],yes:"Evet",no:"Hayır",score:"Sonucu Göster",reset:"Temizle",empty:"Lütfen beş soruyu da yanıtlayınız.",meaning:["0 puan: Kırılganlık taramasında belirgin bulgu yok.","1–2 puan: Kırılganlık öncesi durum olasılığı. Sağlık ekibiyle değerlendirin.","3–5 puan: Kırılganlık açısından pozitif tarama. Geriatrik değerlendirme önerilir."],disclaimer:"FRAIL anketinin tarama amaçlı puanlamasıdır; klinik tanı değildir. Belirtileriniz veya düşme, kilo kaybı, işlev kaybı gibi sorunlarınız varsa sağlık kuruluşuna başvurunuz."},en:{back:"← Home",title:"Self-assessment",warning:"This screen does not diagnose illness. Seek medical assessment for significant symptoms. Answers are calculated only in your browser, not stored. Do not enter identifiers.",frail:"FRAIL — Frailty screening",intro:"Choose the answer that best describes your situation. Answer all five questions.",q:["Have you felt tired most of the time during the last four weeks?","Do you have difficulty climbing 10 steps without help?","Do you have difficulty walking approximately 200 metres without help?","Have you been diagnosed with more than five of: hypertension, diabetes, COPD, heart attack, heart failure, angina, asthma, arthritis, stroke, kidney disease, cancer?","Have you lost at least 5% of your body weight unintentionally in the past year?"],yes:"Yes",no:"No",score:"Show result",reset:"Clear",empty:"Please answer all five questions.",meaning:["Score 0: No positive responses on this frailty screening.","Score 1–2: Possible prefrailty; consider discussing this with your care team.","Score 3–5: Positive frailty screen; a geriatric assessment is recommended."],disclaimer:"FRAIL is a screening questionnaire, not a diagnosis. Consult healthcare professionals about falls, weight loss, declining function, or concerning symptoms."}};let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr";const $=x=>document.getElementById(x);function render(){document.documentElement.lang=lang;const a=t[lang];for(const k of ["back","title","warning","frail","intro","score","reset","disclaimer"])$(k).textContent=a[k];$("questions").innerHTML=a.q.map((q,i)=>'<fieldset class="question"><legend>'+(i+1)+'. '+q+'</legend><label><input type="radio" name="q'+i+'" value="1"> '+a.yes+'</label><label><input type="radio" name="q'+i+'" value="0"> '+a.no+'</label></fieldset>').join("");$("result").textContent="";}function score(){const values=[0,1,2,3,4].map(i=>document.querySelector('input[name="q'+i+'"]:checked')?.value);if(values.some(v=>v===undefined)){$("result").textContent=t[lang].empty;return}const n=values.reduce((x,y)=>x+Number(y),0);$("result").textContent=n+"/5 — "+t[lang].meaning[n===0?0:n<=2?1:2]}$("tr").onclick=()=>{lang="tr";render()};$("en").onclick=()=>{lang="en";render()};$("score").onclick=score;$("reset").onclick=render;render();</script></body></html>
