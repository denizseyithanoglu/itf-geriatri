<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Self-assessment | İTF Geriatri</title><style>:root{font:18px/1.6 system-ui,sans-serif;color:#253b30;background:#f7faf7}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:#fff;padding:24px max(20px,calc((100vw - 920px)/2))}header a{color:white}.wrap{max-width:920px;margin:auto;padding:22px}.warning{background:#fff0d5;border-left:5px solid #a67928;padding:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{background:#e4eee7;color:#234a38;border:1px solid #a4c0ab;border-radius:7px;padding:12px;min-height:48px;font:inherit;cursor:pointer}.tabs button.active{background:#285b4d;color:white}.panel{background:white;padding:22px;border:1px solid #d8e5dc;border-radius:12px}.item{padding:12px 0;border-bottom:1px solid #dfebe2}.item label{display:block;font-weight:650;margin-bottom:6px}.item select{font:inherit;width:100%;min-height:46px;border:1px solid #829b89;padding:9px;border-radius:6px}.button{background:#285b4d;color:#fff;border:0;padding:12px 18px;border-radius:8px;font:inherit;min-height:48px;cursor:pointer}.button.alt{background:#e4efe7;color:#234a38}.score{margin:16px 0;background:#edf6ee;padding:16px;border-left:5px solid #285b4d}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bc840b;outline-offset:2px}@media(max-width:650px){.tabs{display:grid;grid-template-columns:1fr 1fr}.tabs button{font-size:.83rem;padding:8px}}</style></head><body><header><a href="../index.html" id="home"></a><div style="float:right"><button class="button alt" id="tr">TR</button> <button class="button alt" id="en">EN</button></div><h1 id="title"></h1></header><main class="wrap"><p class="warning" id="warn"></p><div class="tabs" id="tabs"></div><div class="panel"><h2 id="scaleTitle"></h2><div id="questions"></div><p><button class="button" id="calc"></button> <button class="button alt" id="reset"></button></p><div class="score" id="answer" aria-live="polite"></div></div><p id="note"></p></main><script>const scales=[{"id":"frail","name":["FRAIL — Kırılganlık","FRAIL — Frailty"],"q":[["Yorgunluk","Fatigue"],["Merdiven çıkma güçlüğü","Difficulty climbing stairs"],["200 metre yürüyüş güçlüğü","Difficulty walking 200 m"],["11 hastalıktan 5’ten fazlası","More than five of 11 specified illnesses"],["Son yılda ≥%5 kilo kaybı","Weight loss ≥5% in the past year"]],"values":[0,1],"labels":[["Hayır","No"],["Evet","Yes"]]},{"id":"sarcf","name":["SARC-F — Sarkopeni","SARC-F — Sarcopenia"],"q":[["5 kg ağırlık kaldırma","Lifting 5 kg"],["Oda içinde yürüme","Walking across room"],["Sandalyeden kalkma","Rising from chair"],["Merdiven çıkma","Climbing stairs"],["Son yıldaki düşme sayısı","Falls in the past year"]],"values":[0,1,2],"labels":[["0 — Yok","0 — None"],["1 — Biraz / 1–3 düşme","1 — Some / 1–3 falls"],["2 — Çok / ≥4 düşme","2 — Severe / ≥4 falls"]]},{"id":"adl","name":["GYA — Günlük Yaşam Aktiviteleri","ADL — Basic Activities"],"q":[["Banyo","Bathing"],["Giyinme","Dressing"],["Tuvalet","Toileting"],["Transfer","Transfer"],["Kontinans","Continence"],["Beslenme","Feeding"]],"values":[1,0],"labels":[["Bağımsız","Independent"],["Yardım gerekiyor","Needs help"]]},{"id":"iadl","name":["EGYA — Enstrümantal Günlük Yaşam Aktiviteleri","IADL — Instrumental Activities"],"q":[["Telefon","Telephone"],["Alışveriş","Shopping"],["Yemek hazırlama","Meal preparation"],["Ev temizliği","Housekeeping"],["Çamaşır","Laundry"],["Ulaşım","Transport"],["İlaç yönetimi","Medications"],["Mali işler","Finances"]],"values":[1,0],"labels":[["Bağımsız","Independent"],["Bağımlı","Dependent"]]},{"id":"gds","name":["GDS-15 — Geriatrik Depresyon Ölçeği","GDS-15 — Geriatric Depression Scale"],"q":[["Yaşamınızdan memnun musunuz?","Are you satisfied with your life?"],["Uğraşlarınızın çoğunu bıraktınız mı?","Have you dropped many activities?"],["Yaşamınızı boş hissediyor musunuz?","Do you feel life is empty?"],["Sık sık canınız sıkılır mı?","Do you often get bored?"],["Genellikle keyfiniz yerinde midir?","Are you in good spirits most of the time?"],["Kötü bir şey olacak diye korkuyor musunuz?","Are you afraid something bad will happen?"],["Çoğunlukla mutlu musunuz?","Do you feel happy most of the time?"],["Sık sık çaresiz hisseder misiniz?","Do you often feel helpless?"],["Dışarı çıkmaktansa evde mi kalırsınız?","Do you prefer staying home to going out?"],["Hafızanızın zayıf olduğunu düşünüyor musunuz?","Do you feel you have more memory problems than most?"],["Yaşıyor olmak güzel midir?","Is it wonderful to be alive?"],["Kendinizi değersiz hissediyor musunuz?","Do you feel worthless?"],["Enerji dolu musunuz?","Do you feel full of energy?"],["Durumunuzu umutsuz buluyor musunuz?","Do you feel your situation is hopeless?"],["Başkalarının sizden iyi durumda olduğunu düşünüyor musunuz?","Do you think most people are better off?"]],"values":[0,1],"labels":[["Hayır","No"],["Evet","Yes"]]}],txt={"tr":{"title":"Kendinizi Değerlendirin","home":"← Ana sayfa","warn":"Bu sayfa yalnızca bilgilendirme amaçlıdır; tanı koymaz. Kişisel bilgi girmeyiniz. Veriler kaydedilmez.","select":"Seçiniz","result":"Sonucu hesapla","clear":"Temizle","incomplete":"Tüm soruları yanıtlayınız.","note":"Yüksek riskli veya kaygı verici sonuçlarda bir sağlık profesyoneline başvurunuz.","labels":["Normal tarama","Risk olabilir — değerlendirme önerilir"]},"en":{"title":"Self-assessment","home":"← Home","warn":"These are screening tools, not diagnoses. Do not enter personal details. Answers are not stored.","select":"Select","result":"Calculate score","clear":"Clear","incomplete":"Answer every question.","note":"Please seek professional advice for concerning symptoms or screening results.","labels":["Screen negative","Further assessment recommended"]}};let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr",active=0;const $=id=>document.getElementById(id);function render(){const k=lang==="tr"?0:1,t=txt[lang];document.documentElement.lang=lang;for(const id of ["title","home","warn","note"])$(id).textContent=t[id];$("calc").textContent=t.result;$("reset").textContent=t.clear;$("tabs").innerHTML=scales.map((s,i)=>'<button type="button" class="'+(i===active?"active":"")+'" data-i="'+i+'">'+s.name[k]+'</button>').join("");$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{active=+b.dataset.i;render()});const s=scales[active];$("scaleTitle").textContent=s.name[k];$("questions").innerHTML=s.q.map((q,i)=>'<div class="item"><label for="q'+i+'">'+(i+1)+'. '+q[k]+'</label><select id="q'+i+'"><option value="">— '+t.select+' —</option>'+s.values.map((v,j)=>'<option value="'+v+'">'+s.labels[j][k]+'</option>').join("")+'</select></div>').join("");$("answer").textContent="";}
function evaluate(){const s=scales[active],t=txt[lang],vals=s.q.map((_,i)=>$("q"+i).value);if(vals.some(v=>v==="")){$("answer").textContent=t.incomplete;return}let score=vals.reduce((sum,x,i)=>{const v=+x;if(s.id==="gds"){const riskYes=[1,2,3,5,7,8,9,11,13,14];return sum+(riskYes.includes(i)?v:1-v)}return sum+v},0);let interpretation="";if(s.id==="frail")interpretation=score===0?"Robust":score<=2?"Pre-frail":"Frail";if(s.id==="sarcf")interpretation=score>=4?"Positive screen / Pozitif tarama":"Negative screen / Negatif tarama";if(s.id==="adl"||s.id==="iadl")interpretation=score===s.q.length?"Independent / Bağımsız":"Some activities require help / Yardım gerekli";if(s.id==="gds")interpretation=score<=4?"Within screening reference range / Tarama referans aralığında":score<=8?"Elevated depressive symptoms / Artmış depresif belirti":"Marked depressive symptoms / Belirgin depresif belirti";$("answer").textContent=score+"/"+(s.id==="sarcf"?10:s.q.length)+" — "+interpretation+". "+t.note}
$("calc").onclick=evaluate;$("reset").onclick=render;$("tr").onclick=()=>{lang="tr";render()};$("en").onclick=()=>{lang="en";render()};render();</script></body></html>
