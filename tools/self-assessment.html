<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kendinizi Değerlendirin | İTF Geriatri</title><style>:root{font:18px/1.55 system-ui,sans-serif;color:#23382e;background:#f6f9f6}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:white;padding:23px max(20px,calc((100vw - 920px)/2))}header a{color:white}main{max-width:920px;margin:auto;padding:20px}.warn{background:#fff1d4;padding:14px;border-left:5px solid #a67524}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.tabs button{width:100%;text-align:left;font-weight:750}.resource-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.resource-links a{background:#fff;border:2px solid #b6d3bf;border-radius:10px;padding:16px;color:#285b4d;font-weight:750;text-decoration:none;min-height:72px}@media(max-width:560px){.resource-links{grid-template-columns:1fr}}.tabs button{background:#e5f0e8;color:#204535;border:1px solid #98b5a0;padding:10px;border-radius:8px;min-height:48px;font:inherit;cursor:pointer}.tabs button.active{background:#285b4d;color:white}.panel{background:white;padding:22px;border:1px solid #d4e3da;border-radius:12px}.item{border-bottom:1px solid #e0e9e1;padding:15px 0}.item .question{font-weight:700;display:block;margin-bottom:9px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{font:inherit;padding:10px 15px;min-height:48px;max-width:100%;text-align:left;background:white;border:2px solid #899f8c;border-radius:7px;color:#20382b;cursor:pointer}.choices button[aria-pressed=true]{background:#285b4d;color:white}.choices:not(.binary) button{width:100%}.star{color:#b00020;font-size:1.3em;font-weight:900;margin-left:6px}.item.done .star{display:none}.info{border:1px solid #809988;background:#eaf4ec;border-radius:50%;width:30px;height:30px;cursor:help;color:#204938;font:700 .85rem sans-serif;margin-left:8px}.result{background:#e8f4eb;border-left:5px solid #285b4d;padding:15px;margin:16px 0}.action{font:inherit;padding:12px 17px;background:#285b4d;color:white;border:0;border-radius:7px;min-height:48px;cursor:pointer}.action.alt{background:#e2ede4;color:#244e3a}button:focus-visible,a:focus-visible{outline:3px solid #bc8500;outline-offset:2px}@media(max-width:650px){.tabs{display:grid;grid-template-columns:repeat(2,1fr)}.tabs button{font-size:.85rem}.panel{padding:15px}}.disease-box{background:#f0f7f2;border:1px solid #b4d0bb;padding:15px;border-radius:9px;margin-top:12px}.disease-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.disease-list label{display:flex;align-items:center;gap:10px;padding:9px;background:white;border:1px solid #b5cdb9;border-radius:6px}.disease-list input{width:22px;height:22px}.disease-note{color:#704c00;font-size:.85rem}@media(max-width:570px){.disease-list{grid-template-columns:1fr}}</style></head><body><header><a href="../index.html" id="home">← Ana sayfa</a><div style="float:right"><button id="tr" class="action alt">TR</button> <button id="en" class="action alt">EN</button></div><h1 id="title">Kendinizi Değerlendirin</h1></header><main><p class="warn" id="warn">Bu testler tanı koymaz. Kaydedilmez; kimlik bilgisi girmeyiniz.</p><nav class="tabs" id="tabs" aria-label="Ölçekler"></nav><section class="panel"><h2 id="scale"></h2><p id="source"></p><div id="questions"></div><p><button class="action" id="calc">Sonucu hesapla</button> <button class="action alt" id="reset">Temizle</button></p><div class="result" id="result" aria-live="polite"></div></section></main><script>
const scales=[{"id":"frail","title":"FRAIL Kırılganlık Anketi","qs":[["Son 4 haftanın tamamında veya çoğunda kendinizi yorgun, bitkin, halsiz hissettiniz mi ?",["Hayır","Evet"],[0,1]],["10 basamak merdiveni dinlenmeden, tek başınıza ve yardımsız yürümekte herhangi bir zorluk çekiyor musunuz ?",["Hayır","Evet"],[0,1]],["~200m.’yi tek başınıza, yardımsız ve güçlük çekmeden yürümekte bir zorluk çekiyor musunuz ?",["Hayır","Evet"],[0,1]],["Şu 11 hastalıktan 5’ten fazlasının teşhisi var mı ?; HT, DM, KOAH, MI, KKY, Angina, Astım, Artrit, İnme, Böbrek Hastalığı, Kanser (küçük deri kanserleri dışında)",["Hayır","Evet"],[0,1]],["Son 1 yıl içinde vücut ağırlığınızın %5’ini kaybettiniz mi ?",["Hayır","Evet"],[0,1]]]},{"id":"sarcf","title":"SARC-F (Sarkopeni Tarama Anketi)","qs":[["Kuvvet — ~5kg. kaldırma ve taşıma",["0-hiç","1-biraz zorlanır","2- çok zorlanır veya yapamaz"],[0,1,2]],["Yürüme — odada yürüme",["0-hiç","1-biraz zorlanır","2- çok zorlanır, yardımla yapar veya yapamaz"],[0,1,2]],["Sandalye — sandalye, yataktan transfer",["0-hiç","1-biraz zorlanır","2- çok zorlanır veya yardımsız yapamaz"],[0,1,2]],["Merdiven — 10 basamak çıkma",["0-hiç","1-biraz zorlanır","2- çok zorlanır, yardımla yapar veya yapamaz"],[0,1,2]],["Düşme — 1 yıl içinde kaç kez düştü",["0-hiç","1-1-3 kez düştü","2- 4 veya daha fazla düştü"],[0,1,2]]]},{"id":"adl","title":"GYA (Günlük Yaşam Aktiviteleri Anketi)","qs":[["Banyo (Küvet, duş) — Yıkanırken hiç yardım almaz veya sadece vücudunun bir bölümünü yıkarken yardım alır",["Evet","Hayır"],[1,0]],["Giyinme — Ayakkabılarını bağlamak dışında kıyafetlerini ve elbiselerini kendisi giyebilir",["Evet","Hayır"],[1,0]],["Tuvalete Gitme — Herhangi bir yardım almadan tuvalete gider, tuvaleti kullanır, kıyafetlerini düzeltir ve tuvaletten geri çıkar. (tuvalete giderken destek için yürüteç veya baston kullanabilir ve gece alt bezi veya üriner kateter kullanabilir)",["Evet","Hayır"],[1,0]],["Transfer — Herhangi bir yardımcı olmadan yataktan sandalyeye veya sandalyeden yatağa geçebilir (baston veya yürüteç kullanabilir)",["Evet","Hayır"],[1,0]],["Kontinans — İdrara çıkma ve dışkılamayı kısmi de olsa bir kaçırma olmadan tamamen kendisi kontrol eder",["Evet","Hayır"],[1,0]],["Beslenme — Yardım almadan kendi kendine beslenir (etini kesme veya ekmeğine tereyağı sürmeye yardım edilmesi haricinde)",["Evet","Hayır"],[1,0]]]},{"id":"iadl","title":"EGYA (Enstrümental Günlük Yaşam Aktiviteleri Anketi)","qs":[["A. Telefonu Kullanabilme",["Telefonu rahatlıkla kullanabilir","Birkaç iyi bilinen numarayı çevirebilir","Telefona cevap verir fakat arayamaz","Telefonu hiç kullanamaz"],[1,1,1,0]],["B. Alış-veriş",["Tüm alış-verişlerini bağımsız olarak kendisi yapar","Küçük alış-verişlerini kendisi yapar","Tüm alış-verişlerinde yardıma ihtiyaç duyar","Alış-veriş yapamaz"],[1,0,0,0]],["C. Yemek Hazırlama",["Yeteri kadar yemeği planlar, hazırlar ve servis edebilir","Kullanılacak malzeme sağlanırsa yeteri kadar yemek hazırlayabilir","Hazır yemeği ısıtır ve servis eder veya yemek hazırlar ancak yeterli diyeti sağlayamaz","Yemeğin hazırlanma ve servis edilmesine ihtiyacı vardır"],[1,0,0,0]],["D. Ev Temizliği",["Yalnız başına veya nadir destekle evin üstesinden gelir","Bulaşık yıkama, yatak yapma gibi günlük hafif işleri yapabilir","Günlük hafif işleri yapar ancak yeterli temizliği sağlayamaz","Tüm ev idame işlerinde yardıma ihtiyaç duyar"],[1,1,1,0]],["E. Çamaşır",["Kişisel çamaşırını tamamen kendisi yıkar","Çorap, mendil gibi küçük malzemelerini yıkayabilir","Tüm çamaşır işi başkaları tarafından halledilmek zorundadır"],[1,1,0]],["F. Yolculuk",["Toplu taşıma araçlarından bağımsız olarak faydalanır veya kendi arabasını kullanır","Taksiye biner, toplu taşıma araçlarını kullanamaz","Başkalarının yardımı ile toplu taşımadan faydalanabilir","Yolculuğu başkalarının yardımı ile taksi/otomobille sınırlıdır","Yolculuk yapamaz"],[1,1,1,1,0]],["G. İlaçlarını Kullanabilme Sorumluluğu",["İlaçlarını zamanında ve belirtilen dozda alabilir","İlaçları önceden dozlarına ayrılmış olarak hazırlanırsa düzenli kullanabilir","İlaçlarını kendi başına düzenli kullanamaz"],[1,0,0]],["H. Mali İşler",["Bağımsız olarak tüm mali işlerinin üstesinden gelebilir","Günlük mali işlerini halleder ancak büyük mali işlerde ve banka işlerinde yardıma ihtiyaç duyar","Mali işlerini takip edemez"],[1,1,0]]]},{"id":"gds","title":"GDS (Geriatrik Depresyon Skalası) — İlk 15 soru","qs":[["Yaşamınızdan temelde memnun musunuz?",["Evet","Hayır"],[1,0]],["Günlük uğraşı ve ilgilerinizin büyük bölümünü terk ettiniz mi?",["Evet","Hayır"],[1,0]],["Yaşamınızın bomboş olduğunu hissediyor musunuz?",["Evet","Hayır"],[1,0]],["Sık sık canınız sıkılır mı?",["Evet","Hayır"],[1,0]],["Genellikle keyfiniz yerinde midir?",["Evet","Hayır"],[1,0]],["Başınıza kötü bir şey geleceğinden korkuyor musunuz?",["Evet","Hayır"],[1,0]],["Çoğunlukla kendinizi mutlu hissediyor musunuz?",["Evet","Hayır"],[1,0]],["Sık sık kendinizi çaresiz hissediyor musunuz?",["Evet","Hayır"],[1,0]],["Dışarı çıkıp yeni bir şeyler yapmaktansa, evde kalmayı tercih eder misiniz?",["Evet","Hayır"],[1,0]],["Hafızanızın çoğu kişiden zayıf olduğunu hissediyor musunuz?",["Evet","Hayır"],[1,0]],["Sizce şu anda yaşıyor olmak güzel bir şey midir?",["Evet","Hayır"],[1,0]],["Kendinizi şu anki halinizle değersiz hissediyor musunuz?",["Evet","Hayır"],[1,0]],["Kendinizi enerji dolu hissediyor musunuz?",["Evet","Hayır"],[1,0]],["Çözümsüz bir durum içinde bulunduğunuzu düşünüyor musunuz?",["Evet","Hayır"],[1,0]],["Çoğu kişinin sizden daha iyi durumda olduğunu düşünüyor musunuz?",["Evet","Hayır"],[1,0]]]}];let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr",active=0;const $=id=>document.getElementById(id);let answers={};let selectedDiseases=new Set();let noneConfirmed=false;const diseaseNames=["Hipertansiyon (HT)","Diyabet (DM)","Astım","Kronik Obstrüktif Akciğer Hastalığı (KOAH)","Kalp Krizi (MI)","Angina","İnme (SVO)","Artrit","Konjestif Kalp Yetmezliği (KKY)","Kronik Böbrek Hastalığı (KBH)","Kanserler (küçük deri kanserleri hariç)"];const escape=s=>String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function draw(){document.documentElement.lang=lang;const en=lang==="en",s=scales[active];$("home").textContent=en?"← Home":"← Ana sayfa";$("title").textContent=en?"Self-assessment":"Kendinizi Değerlendirin";$("warn").textContent=en?"Draft English interface. Questionnaire items below remain in the Turkish wording from the departmental form until an authorized validated English translation is approved. Screening is not diagnosis. Do not enter personal data.":"Sorular ve yanıtlar 27.02.2025 tarihli İTF KGD formundaki ifadelerle verilmiştir. Tarama tanı yerine geçmez. Kimlik bilgisi girmeyiniz.";$("source").textContent=en?"Questionnaire item text is shown in original Turkish. English response wording is not yet a validated translation.":"Kaynak: İTF.HB.FR.217, Rev.03. Kırmızı yıldız yanıtlanmamış zorunlu soruları belirtir.";$("scale").textContent=s.title;$("calc").textContent=en?"Calculate score":"Sonucu hesapla";$("reset").textContent=en?"Clear":"Temizle";$("tabs").innerHTML=scales.map((x,i)=>'<button type="button" data-i="'+i+'" class="'+(i===active?"active":"")+'">'+escape(({frail:"Kırılganlık Taraması (FRAIL)",sarcf:"Sarkopeni Taraması (SARC-F)",adl:"Günlük Yaşam Aktiviteleri (GYA)",iadl:"Enstrümantal Günlük Yaşam Aktiviteleri (EGYA)",gds:"Geriatrik Depresyon Ölçeği (GDS-15)"}[x.id])||x.title)+'</button>').join("");$("tabs").querySelectorAll("button").forEach(btn=>btn.onclick=()=>{active=+btn.dataset.i;draw()});const selected=answers[s.id]||{};$("questions").innerHTML=s.qs.map((q,i)=>{const val=selected[i];return '<div class="item '+(val!==undefined?"done":"")+'" id="item'+i+'"><span class="question">'+(i+1)+'. '+escape(q[0])+'<span class="star" aria-label="zorunlu">*</span><button class="info" type="button" aria-label="Puanlama bilgisi" title="'+(en?"Response score is listed with each option; incomplete items cannot be scored.":"Her yanıtın puanı seçenekte görünür; eksik yanıtla ölçek puanlanmaz.")+'">i</button></span><div class="choices '+(q[1].length===2?"binary":"")+'" id="choices'+i+'">'+q[1].map((label,j)=>'<button type="button" data-j="'+j+'" aria-pressed="'+(val===j)+'">'+escape(label)+' ('+q[2][j]+')</button>').join("")+'</div></div>'}).join("");if(s.id==="frail"){const field=$("item3");const box=document.createElement("div");box.className="disease-box";box.innerHTML='<strong>'+(en?"Select diagnosed diseases:":"Tanı konmuş hastalıkları seçiniz:")+'</strong><div class="disease-list">'+diseaseNames.map((n,i)=>'<label><input type="checkbox" data-i="'+i+'" '+(selectedDiseases.has(i)?"checked":"")+'>'+escape(n)+'</label>').join("")+'</div><label><input id="noneDisease" type="checkbox" '+(noneConfirmed?'checked':'')+'> '+(en?'None of the listed conditions':'Listelenen hastalıkların hiçbiri')+'</label><p id="diseaseStatus"></p><p class="disease-note">'+(en?"Requested prototype threshold: five or more. Source wording says more than five; review before clinical use.":"İsteğiniz üzerine 5 ve üzeri 1 puandır. Basılı formda ‘5’ten fazlası’ yazıyor; klinik kullanım öncesi doğrulanmalıdır.")+'</p>';field.appendChild(box);const sync=()=>{const count=selectedDiseases.size;const point=count>=5?1:0;if(!answers.frail)answers.frail={};answers.frail[3]=(count===0&&!noneConfirmed)?undefined:point;const group=$("choices3");group.querySelectorAll("button").forEach(btn=>{btn.disabled=true;btn.setAttribute("aria-pressed",String(+btn.dataset.j===point&&(count>0||noneConfirmed)))});field.classList.toggle("done",count>0||noneConfirmed);$("diseaseStatus").textContent=count+" / 11 → "+(count>=5?"1":"0")+(count===0?" (henüz seçim yok)":"")};box.querySelectorAll(".disease-list input").forEach(x=>x.onchange=()=>{const i=+x.dataset.i;x.checked?selectedDiseases.add(i):selectedDiseases.delete(i);if(x.checked){noneConfirmed=false;box.querySelector("#noneDisease").checked=false}sync()});box.querySelector("#noneDisease").onchange=e=>{noneConfirmed=e.target.checked;if(noneConfirmed){selectedDiseases.clear();box.querySelectorAll(".disease-list input").forEach(x=>x.checked=false)}sync()};sync()}$("questions").querySelectorAll(".choices").forEach((group,i)=>group.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{if(!answers[s.id])answers[s.id]={};answers[s.id][i]=+btn.dataset.j;group.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===btn)));$("item"+i).classList.add("done")}));$("result").textContent="";}
function score(){const s=scales[active],v=answers[s.id]||{};const missing=s.qs.map((_,i)=>i).filter(i=>v[i]===undefined);if(missing.length){$("result").textContent=(lang==="en"?"Missing answers: ":"Yanıtlanmamış sorular: ")+missing.map(i=>i+1).join(", ");return}let n=s.qs.reduce((sum,q,i)=>{const idx=v[i];if(s.id==="gds"){const yesRisk=[1,2,3,5,7,8,9,11,13,14];return sum+(yesRisk.includes(i)?(idx===0?1:0):(idx===1?1:0))}return sum+q[2][idx]},0);let desc="";if(s.id==="frail")desc=n===0?"Normal":n<3?"Pre-frail":"Frail";if(s.id==="sarcf")desc=n>=4?"Pozitif tarama":"Negatif tarama";if(s.id==="adl"||s.id==="iadl")desc=n===s.qs.length?"Bağımsız":"Bazı aktivitelerde bağımlılık";if(s.id==="gds")desc="Depresif belirti taraması — klinik değerlendirme gerekir";$("result").textContent=n+"/"+(s.id==="sarcf"?10:s.qs.length)+" — "+desc+"; "+(lang==="en"?"Not a diagnosis.":"Tanı değildir.");}
$("calc").onclick=score;$("reset").onclick=()=>{answers[scales[active].id]={};if(scales[active].id==="frail")selectedDiseases.clear();noneConfirmed=false;draw()};$("tr").onclick=()=>{lang="tr";draw()};$("en").onclick=()=>{lang="en";draw()};draw();
</script></body></html>
