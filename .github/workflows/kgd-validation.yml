name: KGD JavaScript and print checks
on:
  pull_request:
    paths:
      - 'tools/kgd.html'
      - '.github/workflows/kgd-validation.yml'
  push:
    paths:
      - 'tools/kgd.html'
      - '.github/workflows/kgd-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check KGD inline JavaScript syntax and print controls
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const src=readFileSync('tools/kgd.html','utf8');
          const scripts=[...src.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          assert.ok(scripts.length>0,'KGD script must exist');
          for(const [i,m] of scripts.entries())new vm.Script(m[1],{filename:'kgd-'+i+'.js'});
          for(const id of ['wizardPrintSection','wizardPrintSectionDetailed','printFinal','printFinalDetailed','printSheet'])
            assert.ok(src.includes('id="'+id+'"'),'Missing button/print element: '+id);
          for(const method of ['kgdMMSEPrintScore','kgdScalePrintScore','kgdDetailedPrintStep','kgdShortPrintStep','printKGD'])
            assert.ok(src.includes('function '+method),'Missing print function: '+method);
          assert.ok(src.includes('n>5?"1":"0"'),'FRAIL illness threshold must match attached KGD PDF');
          const fjson=src.match(/const forms=(\[[\s\S]*?\]),texts=/);
          assert.ok(fjson,'Forms schema must be readable');
          const forms=JSON.parse(fjson[1]);
          const start=src.indexOf('function kgdScalePrintScore(id){');
          const finish=src.indexOf('function kgdMNATotalScore(){',start);
          assert.ok(start>=0&&finish>start,'Print scorers must be extractable');
          const inputs={};
          const ctx={
            forms,
            KGD_PRINT_LABELS:{
              adl:['banyo','giyinme','tuvalet','transfer','kontinans','beslenme'],
              iadl:['telefon','alışveriş','yemek hazırlama','ev temizliği','çamaşır','yolculuk','ilaç kullanımı','mali işler']
            },
            $:id=>({value:inputs[id]??''}),
            scaleItemScore:(f,i,v)=>f.scoreOptions?f.scoreOptions[i][Number(v)]:Number(v),
            moreAnswers:{},moreText:{},mmseVariant:'standard',mmseAttentionMode:'subtract'
          };
          ctx.scaleTotal=(f,v)=>v.reduce((a,x,i)=>a+ctx.scaleItemScore(f,i,x),0);
          const extraMatch=src.match(/,additional=(\[[\s\S]*?\]),gds30=/);
          assert.ok(extraMatch,'PDF-scale question lists must exist');
          ctx.additional=JSON.parse(extraMatch[1]);
          ctx.safe=x=>String(x);
          ctx.mmseCopyPrompt=()=>'<figure>copy task</figure>';
          ctx.mmseReadPrompt=()=>'<figure>read task</figure>';
          const viewStart=src.indexOf('const mmseWorldLetters=[');
          const viewEnd=src.indexOf('function organizeMiniCog(){',viewStart);
          assert.ok(viewStart>=0&&viewEnd>viewStart,'MMSE UI and attention helper must be extractable');
          vm.runInNewContext(src.slice(viewStart,viewEnd),ctx);
          vm.runInNewContext(src.slice(start,finish),ctx);
          function provide(id,v){v.forEach((x,i)=>inputs[id+'_'+i]=String(x));}
          provide('adl',[0,0,0,0,1,0]);
          assert.equal(ctx.kgdScalePrintScore('adl'),'5/6 (-1 kontinans)');
          provide('iadl',[0,0,0,0,2,4,0,0]);
          assert.equal(ctx.kgdScalePrintScore('iadl'),'6/8 (-1 çamaşır, -1 yolculuk)');
          provide('frail',[1,0,0,0,0]);
          assert.equal(ctx.kgdScalePrintScore('frail'),'1/5 (pre-frail)');
          provide('mna',[2,3,2,2,2,3]);
          assert.equal(ctx.kgdScalePrintScore('mna'),'14/14 (normal)');
          for(let i=0;i<30;i++)ctx.moreAnswers['mmse_standard_'+i]='1';
          ctx.moreAnswers.mmse_standard_0='0';
          ctx.moreAnswers.mmse_standard_13='0';
          assert.equal(ctx.kgdMMSEPrintScore(),'28/30 (-1 oryantasyon, -1 dikkat)');
          delete ctx.moreAnswers.mmse_standard_14;
          assert.equal(ctx.kgdMMSEPrintScore(),'eksik (29/30 yanıt)');
          ctx.moreAnswers.mmse_standard_14='1';
          const primaryScore=ctx.kgdMMSEPrintScore();
          assert.equal(primaryScore,'28/30 (-1 oryantasyon, -1 dikkat)');
          let standard=ctx.renderMMSEGroups();
          assert.equal((standard.match(/class="mmse-group mmse-cards-three"/g)||[]).length,3);
          assert.equal((standard.match(/class="mmse-group mmse-cards-two"/g)||[]).length,1);
          assert.ok(standard.includes('data-mmse="mmse_standard_13"'),'Primary attention keeps original keys');
          assert.ok(standard.includes('İpucu:')&&standard.includes('Çoktan Seçmeli:'));
          assert.ok(standard.includes('Bir renk')&&standard.includes('Kartal, Şahin, Şahıs'));
          assert.ok(standard.includes('mmseAttentionSwitch'),'Standard MMSE has alternate attention switch');
          assert.ok(standard.includes('Uygulayıcı notu:'),'Source-based clinical notes included');
          ctx.mmseAttentionMode='world';
          const alternative=ctx.renderMMSEGroups();
          assert.ok(alternative.includes('data-mmse="mmse_world_0"'),'Alternative has independent keys');
          assert.ok(alternative.includes('A – Y – N – Ü – D'),'DÜNYA sequence should match PDF');
          assert.equal(ctx.kgdMMSEPrintScore(),'eksik (25/30 yanıt)','Unanswered alternate must not use subtraction score');
          for(let i=0;i<5;i++)ctx.moreAnswers['mmse_world_'+i]='1';
          ctx.moreAnswers.mmse_world_0='0';
          ctx.moreAnswers.mmse_world_1='0';
          assert.equal(ctx.kgdMMSEPrintScore(),'27/30 (-1 oryantasyon, -2 dikkat)');
          assert.equal(ctx.mmseScoreSummary(),'27/30 (normal)');
          ctx.mmseAttentionMode='subtract';
          assert.equal(ctx.kgdMMSEPrintScore(),primaryScore,'Switching back must preserve primary results');
          ctx.mmseVariant='uneducated';
          const uneducated=ctx.renderMMSEGroups();
          assert.ok(uneducated.includes('Bir devlet sembolü')&&uneducated.includes('Bayram, Bayrak, Sancak'));
          assert.ok(uneducated.includes('Pazar’dan önce Cumartesi gelir'));
          assert.ok(!uneducated.includes('id="mmseAttentionSwitch"'),'Uneducated MMSE uses PDF day-sequence only');
          assert.equal(ctx.kgdMMSEPrintScore(),null,'No scores in uneducated MMSE remains incomplete');
          assert.ok(src.includes('mmseAttentionMode=data.mmseAttentionMode==="world"?"world":"subtract"'));
          assert.ok(src.includes('noDiseases:frailNone,mmseVariant,mmseAttentionMode'));
          // Recall aid buttons are per-word and per-MMSE-version, not additional MMSE items.
          ctx.mmseVariant='standard';
          const recall=ctx.mmseRecallAids();
          assert.equal((recall.match(/class="mmse-recall-choice"/g)||[]).length,9);
          assert.equal((recall.match(/data-recall-method="hint"/g)||[]).length,3);
          assert.equal((recall.match(/data-recall-method="multiple"/g)||[]).length,3);
          assert.equal((recall.match(/data-recall-method="free"/g)||[]).length,3);
          assert.ok(recall.includes('data-recall-index="1"'));
          assert.ok(recall.includes('Bir kuş')&&recall.includes('Kartal, Şahin, Şahıs'));
          assert.ok(recall.includes('id="mmse-recall-notes-standard"'));
          assert.equal((ctx.renderMMSEGroups().match(/class="mmse-long-answer"/g)||[]).length,2);
          assert.ok(src.includes('mmse-recall-notes-"+mmseVariant'));
          assert.ok(src.includes('mmseEntries.push(["Hatırlama — "+name,recallLabels[method]])'));
          ctx.mmseVariant='uneducated';
          assert.ok(ctx.mmseRecallAids().includes('id="mmse-recall-notes-uneducated"'));
          assert.equal((ctx.renderMMSEGroups().match(/class="mmse-long-answer"/g)||[]).length,2);
          ctx.mmseVariant='standard';
          // Exercise the actual click handler against a minimal DOM stub.
          const makeButton=(method,index)=>({
            dataset:{recallMethod:method,recallIndex:String(index)},
            setAttribute(key,value){if(key==='aria-pressed')this.pressed=value},
            onclick:null
          });
          const cue=makeButton('hint',1),free=makeButton('free',1),multi=makeButton('multiple',1);
          const scoreButton=(score)=>({
            dataset:{mmse:'mmse_standard_19',v:score},
            parentElement:{querySelectorAll:()=>[]},
            closest:()=>({querySelector:()=>({style:{}})}),
            setAttribute(){},onclick:null
          });
          const zero=scoreButton('0'),one=scoreButton('1');
          const scoreItems=[zero,one];
          zero.parentElement.querySelectorAll=()=>scoreItems;
          one.parentElement.querySelectorAll=()=>scoreItems;
          const question={querySelectorAll:()=>scoreItems,querySelector:()=>({style:{}})};
          ctx.document={
            querySelectorAll(sel){
              if(sel==='#mmse-assessment [data-recall-method]')return [cue,free,multi];
              if(sel==='#mmse-assessment [data-recall-index="1"]')return [cue,free,multi];
              if(sel==='[data-mmse]')return [zero,one];
              return [];
            },
            querySelector(sel){
              if(sel==='#mmse-assessment [data-mmse="mmse_standard_19"]')return {closest:()=>question};
              return null;
            }
          };
          ctx.$=()=>null;
          ctx.summarize=()=>{};
          ctx.writeKGDDraft=()=>{};
          const hStart=src.indexOf('function attachMMSE(){');
          const hEnd=src.indexOf('const demographics=',hStart);
          vm.runInNewContext(src.slice(hStart,hEnd),ctx);
          ctx.attachMMSE();
          ctx.moreAnswers.mmse_standard_19='1';
          cue.onclick();
          assert.equal(ctx.moreAnswers.mmse_recall_standard_1,'hint');
          assert.equal(ctx.moreAnswers.mmse_standard_19,'0','Prompted recall must not add an MMSE point');
          assert.equal(cue.pressed,'true');
          multi.onclick();
          assert.equal(ctx.moreAnswers.mmse_recall_standard_1,'multiple');
          assert.equal(ctx.moreAnswers.mmse_standard_19,'0');
          free.onclick();
          assert.equal(ctx.moreAnswers.mmse_recall_standard_1,'free');
          assert.equal(ctx.moreAnswers.mmse_standard_19,'1');
          zero.onclick();
          assert.equal(ctx.moreAnswers.mmse_standard_19,'0');
          assert.equal(ctx.moreAnswers.mmse_recall_standard_1,undefined,'Zero after free recall clears unsupported free mode');
          assert.equal(ctx.moreAnswers.mmse_recall_uneducated_1,undefined,'MMSE versions remain separate');
          // Mini-COG impairment is a manual Yok/Var interpretation, not an automated diagnosis.
          const minicogPos=src.indexOf('section.appendChild(impairment);');
          const minicogNotesPos=src.indexOf('section.appendChild(notes);',minicogPos);
          assert.ok(minicogPos>0&&minicogNotesPos>minicogPos,'Mini-COG Yok/Var must appear above notes');
          assert.ok(src.includes('["Yok","Var"].map(value=>'),'Both Mini-COG choices must render');
          assert.ok(src.includes('if(sec.querySelector("#minicogImpairment"))delete moreAnswers.miniCogImpairment'),'Mini-COG reset must clear choice');
          assert.ok(src.includes('["Mini-COG kognitif bozukluk",moreAnswers.miniCogImpairment]'),'Short PDF should print choice');
          assert.ok(src.includes('["Mini-COG’a Göre Kognitif Bozukluk",moreAnswers.miniCogImpairment]'),'Detailed PDF should print choice');
          const choiceStart=src.indexOf('function setMiniCogImpairment(value){');
          const choiceEnd=src.indexOf('function updateMiniClockScore(){',choiceStart);
          assert.ok(choiceStart>=0&&choiceEnd>choiceStart,'Mini-COG button action function must exist');
          let saves=0,updates=0;
          const btnYok={dataset:{miniCogImpairment:'Yok'},setAttribute(name,value){if(name==='aria-pressed')this.pressed=value}};
          const btnVar={dataset:{miniCogImpairment:'Var'},setAttribute(name,value){if(name==='aria-pressed')this.pressed=value}};
          const minicogContext={
            moreAnswers:{},
            document:{querySelectorAll:()=>[btnYok,btnVar]},
            summarize:()=>{updates++},
            writeKGDDraft:()=>{saves++}
          };
          vm.runInNewContext(src.slice(choiceStart,choiceEnd),minicogContext);
          minicogContext.setMiniCogImpairment('Var');
          assert.equal(minicogContext.moreAnswers.miniCogImpairment,'Var');
          assert.equal(btnVar.pressed,'true');
          assert.equal(btnYok.pressed,'false');
          minicogContext.setMiniCogImpairment('Yok');
          assert.equal(minicogContext.moreAnswers.miniCogImpairment,'Yok');
          assert.equal(btnVar.pressed,'false');
          assert.equal(btnYok.pressed,'true');
          minicogContext.setMiniCogImpairment('Yok');
          assert.equal(minicogContext.moreAnswers.miniCogImpairment,undefined,'Second tap can clear an accidental selection');
          minicogContext.setMiniCogImpairment('invalid');
          assert.equal(saves,3);
          assert.equal(updates,3);
          // MMSE subtraction reference numbers and spoken DÜNYA are user-visible, not new score slots.
          ctx.mmseVariant='standard';
          ctx.mmseAttentionMode='subtract';
          const expectedSubtractions=[93,86,79,72,65];
          expectedSubtractions.forEach((answer,i)=>{
            assert.ok(ctx.mmseQuestionLabel(ctx.additional[3][1][13+i],13+i).endsWith('('+answer+')'));
          });
          assert.ok(ctx.renderMMSEGroups().includes('data-mmse-timer="writing-standard"'));
          assert.ok(ctx.renderMMSEGroups().includes('data-mmse-timer="copy-standard"'));
          assert.ok(ctx.renderMMSEGroups().includes('id="mmseCopyFile-standard"'));
          ctx.mmseAttentionMode='world';
          assert.ok(ctx.mmseClinicianNote(13).includes('sesli olarak söylemesini'));
          assert.ok(!ctx.mmseClinicianNote(13).includes('yazmasını'));
          assert.ok(ctx.renderMMSEGroups().includes('tersten söyleme'));
          ctx.mmseVariant='uneducated';
          assert.ok(ctx.renderMMSEGroups().includes('id="mmseCopyFile-uneducated"'));
          assert.ok(ctx.renderMMSEGroups().includes('data-mmse-timer="copy-uneducated"'));
          assert.ok(!ctx.renderMMSEGroups().includes('data-mmse-timer="writing-standard"'));
          assert.ok(src.includes('Hastanın Kopya Çizimi')&&src.includes('+img+copyPhoto;'));
          assert.ok(src.includes('input[type="text"]'),'File input paths must not be saved in draft');
          // Timers use wall-clock deadlines so they remain accurate across throttled tabs.
          let now=200000,ticks=0;
          ctx.Date={now:()=>now};
          ctx.setInterval=()=>++ticks;
          ctx.clearInterval=()=>{};
          ctx.actMMSETimer('writing-standard','toggle');
          now+=11000;
          assert.equal(Math.ceil(ctx.mmseRemaining('writing-standard')/1000),19);
          ctx.actMMSETimer('writing-standard','toggle'); // pause
          now+=5000;
          assert.equal(Math.ceil(ctx.mmseRemaining('writing-standard')/1000),19);
          ctx.actMMSETimer('writing-standard','reset');
          assert.ok(ctx.mmseTimerMarkup('writing-standard',30).includes('00:30'));
          ctx.actMMSETimer('copy-standard','toggle');
          now+=60001;
          ctx.refreshMMSETimer('copy-standard');
          assert.ok(ctx.mmseTimerMarkup('copy-standard',60).includes('00:00'));
          ctx.actMMSETimer('copy-standard','toggle');
          assert.equal(Math.ceil(ctx.mmseRemaining('copy-standard')/1000),60);
          // A drawing remains local and is isolated by MMSE variant.
          let revoked=null;
          ctx.URL={createObjectURL:()=> 'blob:local-copy-test',revokeObjectURL:x=>{revoked=x}};
          ctx.alert=()=>{throw Error('Valid image unexpectedly rejected')};
          ctx.handleMMSECopyImage('standard',{type:'image/png',size:2000});
          assert.ok(ctx.mmseCopyUploadPanel('standard').includes('blob:local-copy-test'));
          assert.ok(!ctx.mmseCopyUploadPanel('uneducated').includes('blob:local-copy-test'));
          ctx.clearMMSECopyImage('standard');
          assert.equal(revoked,'blob:local-copy-test');
          assert.ok(!ctx.mmseCopyUploadPanel('standard').includes('blob:local-copy-test'));
          console.log('MMSE 7-subtraction answers, oral DÜNYA, timers, local drawing preview & report: OK');
          console.log('Mini-COG Yok/Var: above notes, selects/toggles, persists and prints: OK');
          console.log('MMSE recall: 9 interactive options, small notes, wider fields, isolated and scored click handlers: OK');
          console.log('KGD syntax + scoring examples + 3/2-column MMSE + switches + independent attention keys: OK');
          NODE
