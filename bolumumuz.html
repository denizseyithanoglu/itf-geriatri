let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr";
const $=id=>document.getElementById(id);
function makeProfiles(id,group){
 const box=$(id);box.replaceChildren();
 for(const person of people[group]){
  const card=document.createElement("article");card.className="profile";
  const heading=document.createElement("h4");heading.textContent=person.name;card.appendChild(heading);
  if(group==="chair"){const sub=document.createElement("p");sub.className="profile-subtitle";sub.textContent=lang==="tr"?"İstanbul Tıp Fakültesi · Geriatri Bilim Dalı":"Istanbul Faculty of Medicine · Division of Geriatrics";card.appendChild(sub)}
  if(person.note){const note=document.createElement("p");note.className="profile-note";note.textContent=person.note;card.appendChild(note)}
  const links=document.createElement("div");links.className="profile-links";
  const all=[...(person.avesis?[{label:"AVESİS",url:person.avesis}]:[]),...person.other];
  for(const link of all){const a=document.createElement("a");a.href=link.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=link.label+" ↗";a.setAttribute("aria-label",person.name+" — "+link.label+" (yeni sekme)");links.appendChild(a)}
  card.appendChild(links);box.appendChild(card);
 }
}
function show(){
 document.documentElement.lang=lang;const t=words[lang];
 for(const key of ["title","back","intro","note","clinicalHistory","historyHint","milestones","milestonesHint","mission","missionHint","vision","visionHint","chairs","message","messageHint","media","mediaHint","faculty","fellows","graduates","experienceHint","storiesHint","other","otherDesc","otherBtn"]){if($(key))$(key).textContent=t[key]}

 $("otherBtn").href="geriatri-hakkinda.html?lang="+lang;
}
