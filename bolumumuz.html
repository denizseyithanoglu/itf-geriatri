<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bölümümüz | İTF Geriatri</title><style>:root{font:18px/1.6 system-ui,sans-serif;color:#203a30;background:#f7faf7}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:white;padding:23px max(22px,calc((100vw - 930px)/2))}header a{color:white}.lang{float:right}.lang button{padding:9px;background:white;border:0;border-radius:6px;color:#285b4d;font:inherit;cursor:pointer}main{max-width:930px;margin:auto;padding:20px}section{background:#fff;padding:20px;margin:17px 0;border:1px solid #d8e8de;border-radius:12px}h2{color:#285b4d;font-size:1.45rem;margin-top:5px}h3{font-size:1.08rem;color:#285b4d}details{border-bottom:1px solid #e2eae4;padding:10px 3px}details summary{font-size:1.13rem;font-weight:800;cursor:pointer;color:#204d3d;padding:12px 5px;list-style:none;display:flex;align-items:center;gap:12px}details summary::-webkit-details-marker{display:none}.syndrome-icon{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:10px;background:#e8f2ea;font-size:1.5rem}details summary::after{content:"＋";margin-left:auto;color:#37705a}details[open] summary::after{content:"−"}details p{margin:9px 2px}.cta{display:inline-flex;background:#285b4d;border-radius:8px;padding:13px 18px;color:white;text-decoration:none;font-weight:750}.note{background:#fff0d8;border-left:4px solid #b78528;padding:13px}a{color:#235d4a}a:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid #b88500;outline-offset:3px}@media(max-width:650px){main{padding:13px}section{padding:15px}}</style></head><body><header><a id="back" href="index.html">← Ana sayfa</a><div class="lang"><button type="button" id="tr">TR</button> <button type="button" id="en">EN</button></div><h1 id="title">Bölümümüz</h1></header><main><p id="intro"></p><section><h2 id="syndromeTitle"></h2><p id="syndromeIntro"></p><div id="syndromes"></div></section><section><h2 id="selfTitle"></h2><p id="selfIntro"></p><a class="cta" id="selfLink" href="tools/self-assessment.html">Öz Değerlendirme Anketlerine Git →</a></section><section><h2 id="careTitle"></h2><p id="careIntro"></p><h3 id="careSigns"></h3><p id="careSignsText"></p><h3 id="careSuggestions"></h3><p id="careSuggestionsText"></p><p class="note" id="careUrgent"></p></section><section><h2 id="sources"></h2><ul><li><a href="https://ankarasehir.saglik.gov.tr/TR-1389775/v---geriatri-biliminin-ilgilendigi-konular-nelerdir.html" target="_blank" rel="noopener">T.C. Sağlık Bakanlığı — Geriatrinin İlgilendiği Konular</a></li><li><a href="https://yalvacdh.saglik.gov.tr/TR-820531/yasli-sagligi-rehberleri.html" target="_blank" rel="noopener">T.C. Sağlık Bakanlığı — Yaşlı Sağlığı Rehberleri</a></li></ul></section><p class="note" id="note"></p></main><script>const content={"tr":{"title":"Bölümümüz","back":"← Ana sayfa","intro":"Geriatri, ileri yaşta bireyin hastalıklarını, günlük yaşam işlevlerini, hareketliliğini, beslenmesini, bilişsel ve ruhsal sağlığını bütüncül olarak değerlendiren tıp alanıdır.","syndromeTitle":"Geriatrik Sendromlar Nedir?","syndromeIntro":"Geriatrik sendromlar, tek bir organ hastalığıyla açıklanamayan; birden fazla etkenin bir araya gelmesiyle oluşabilen ve kişinin bağımsızlığını etkileyen sorunlardır. Aşağıdaki başlıklara tıklayarak açıklamaları okuyabilirsiniz.","selfTitle":"Kendinizi Değerlendirin","selfIntro":"Kırılganlık, kas sağlığı, günlük yaşam aktiviteleri ve ruh hâli için kısa tarama anketlerine ulaşabilirsiniz. Bu testler tanı koymaz.","selfButton":"Öz Değerlendirme Anketlerine Git →","careTitle":"Bakımveren Sağlığı ve Bakımveren Tükenmişliği","careIntro":"Bir yakına uzun süre bakım vermek değerli ama fiziksel ve duygusal açıdan yorucu olabilir. Bakımverenin sağlığı da bakımın önemli bir parçasıdır.","careSigns":"Tükenmişlik belirtileri","careSignsText":"Sürekli yorgunluk, uyku bozukluğu, tahammülsüzlük, sosyal yaşamdan uzaklaşma, kaygı, çökkünlük ve kendine zaman ayıramama dikkat edilmesi gereken belirtilerdir.","careSuggestions":"Neler yardımcı olabilir?","careSuggestionsText":"Bakım görevlerini mümkünse paylaşın, düzenli mola ve uyku için plan yapın, sağlık kontrollerinizi ihmal etmeyin, arkadaş ve aile desteği isteyin. Sosyal hizmet ve geçici bakım desteklerini sağlık ekibinizle görüşün. Belirtiler sürüyorsa profesyonel destek alın.","careUrgent":"Bakımverenin veya bakım alan kişinin güvenliğini tehdit eden bir durum ya da kendine zarar verme düşüncesi varsa acil destek isteyin.","sources":"Yararlı Kaynaklar","note":"Bu sayfa genel bilgilendirme içindir; kişisel tanı veya tedavi yerine geçmez."},"en":{"title":"About Our Division","back":"← Home","intro":"Geriatrics offers comprehensive assessment of health, function, mobility, nutrition, cognition and psychological wellbeing in older adults.","syndromeTitle":"What Are Geriatric Syndromes?","syndromeIntro":"These are multifactorial conditions that can affect independence and quality of life. Open each heading for details.","selfTitle":"Self-assessment","selfIntro":"Find brief screening questionnaires for frailty, muscle health, daily function and mood. Screening is not diagnosis.","selfButton":"Open Self-assessment →","careTitle":"Caregiver Health and Burnout","careIntro":"Providing long-term care for a family member can be emotionally and physically demanding. Caregiver wellbeing matters.","careSigns":"Signs of burnout","careSignsText":"Persistent fatigue, poor sleep, irritability, isolation, anxiety and low mood can be warning signs.","careSuggestions":"What can help?","careSuggestionsText":"Share responsibilities when possible, plan breaks and sleep, keep your own medical appointments, seek support and ask your healthcare team about respite services.","careUrgent":"Seek urgent assistance if anyone's safety is at risk or there are thoughts of self-harm.","sources":"Useful Sources","note":"General information only; not a substitute for personalized medical care."}},syndromes=[["Demans ve Bilişsel Gerileme","Bellek, dil, planlama ve günlük yaşam işlevlerini etkileyen ilerleyici sorunlardır. Her unutkanlık demans değildir; değerlendirme gerekir.","Dementia and cognitive decline","Persistent problems with memory and daily functioning merit assessment; not all forgetfulness is dementia."],["Deliryum","Saatler veya günler içinde başlayan, dalgalanan dikkat ve farkındalık bozukluğudur. Ani kafa karışıklığı acil tıbbi değerlendirme gerektirir.","Delirium","A sudden, fluctuating change in attention or awareness requires urgent medical assessment."],["Depresyon ve Ruhsal Sorunlar","İlgi kaybı, çökkünlük, uyku ve iştah değişiklikleri ileri yaşta da tedavi edilebilir sağlık sorunları olabilir.","Depression and mental health","Low mood or loss of interest can be treatable and should not be dismissed as ageing."],["Kırılganlık","Stres etkenlerine karşı dayanıklılığın azalmasıdır. Yorgunluk, güçsüzlük, yavaşlama ve kilo kaybı gibi belirtilerle görülebilir; normal yaşlanma ile aynı değildir.","Frailty","Reduced resilience to stressors, sometimes associated with weakness, slowness, fatigue and weight loss."],["Kötü Beslenme (Malnütrisyon)","İstem dışı kilo kaybı, iştahsızlık ve yetersiz protein/enerji alımı güçsüzlük ile ilişkili olabilir. Çiğneme ve yutma sorunları da değerlendirilmelidir.","Malnutrition","Unintended weight loss and insufficient intake may affect strength and health."],["Çiğneme ve Yutma Problemleri","Diş ve protez sorunları, ağız kuruluğu veya yutma güçlüğü yeterli beslenmeyi engelleyebilir. Yemek sırasında öksürme, boğulma hissi veya açıklanamayan kilo kaybı değerlendirilmelidir.","Chewing and Swallowing Difficulties","Dental problems, dry mouth or dysphagia may reduce food intake. Coughing or choking during meals needs assessment."],["Sarkopeni ve Kas Güçsüzlüğü","Kas gücü ve kas kütlesinin azalması; yürüme, merdiven çıkma ve sandalyeden kalkma gibi işlevleri etkileyebilir. Egzersiz ve yeterli beslenme önemlidir.","Sarcopenia and weakness","Loss of muscle strength and mass can make walking and rising from a chair harder."],["Düşme ve Denge Bozuklukları","Düşmeler, yaralanmaya ve bağımsızlık kaybına neden olabilir. İlaçlar, görme, kas gücü, denge, tansiyon ve ev içi riskler birlikte değerlendirilmelidir.","Falls and balance problems","Falls may lead to injury or loss of independence. Medicines, vision, balance, strength and home hazards should be reviewed."],["Osteoporoz (Kemik Erimesi) ve Kırıklar","Kemik dayanıklılığının azalması özellikle kalça ve omurga kırıklarına yol açabilir. Düşük enerjili kırık öyküsü değerlendirme gerektirir.","Osteoporosis and fractures","Fragility fractures warrant bone-health and falls-risk evaluation."],["Hareketsizlik ve İşlev Kaybı","Hastalık veya yatak istirahati sonrası günlük yaşam becerileri azalabilir. Güvenli erken hareket ve rehabilitasyon planı yararlı olabilir.","Immobility and functional decline","Illness and inactivity may reduce independence; safe mobilisation and rehabilitation matter."],["Bası Yaraları","Uzun süre aynı pozisyonda kalma, hareketsizlik ve yetersiz beslenmeyle ilişkili doku hasarıdır. Cilt kontrolü ve basıncın azaltılması önemlidir.","Pressure injuries","Skin injury from prolonged pressure may be prevented with risk assessment and pressure relief."],["Uyku Bozuklukları","Uykusuzluk, uyku apnesi, huzursuz bacak ve gündüz uyuklama gibi sorunlar düşme, dikkat ve yaşam kalitesini etkileyebilir.","Sleep problems","Insomnia, sleep apnea and daytime sleepiness can affect wellbeing and function."],["Kronik Ağrı","Süregelen ağrı hareketliliği, uykuyu ve ruh hâlini etkileyebilir. Ağrı nedeni ve tedavi riskleri birlikte değerlendirilmelidir.","Chronic pain","Persistent pain may affect mobility, sleep and mood and merits individual assessment."],["İdrar ve Dışkı Kaçırma","İnkontinans günlük yaşamı etkileyebilir. İlaçlar, kabızlık, idrar yolu sorunları ve hareket kısıtlılığı gibi nedenler araştırılabilir.","Urinary and fecal incontinence","Incontinence may have treatable contributors and deserves clinical evaluation."],["Kabızlık","Hareketsizlik, yetersiz sıvı veya lif, ilaçlar ve bazı hastalıklar kabızlığa katkıda bulunabilir. Yeni veya ciddi belirtiler hekim tarafından değerlendirilmelidir.","Constipation","Medicines, inactivity and illness can contribute; persistent or alarming symptoms need assessment."],["Görme Problemleri","Görme azalması günlük işleri ve düşme riskini etkileyebilir. Görme muayenesi, uygun gözlük ve katarakt gibi tedavi edilebilir nedenlerin değerlendirilmesi önemlidir.","Vision Problems","Vision loss can affect daily tasks and safety. Eye assessment and correctable causes should be reviewed."],["İşitme Problemleri","İşitme kaybı iletişimi ve sosyal katılımı zorlaştırabilir. İşitme değerlendirmesi ve uygun yardımcı cihazlar yararlı olabilir.","Hearing Problems","Hearing loss can affect communication and social participation; testing and hearing aids may help."]];let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr";const icons=["🧠","⚡","💬","🌿","🥣","🦷","💪","⚖️","🦴","🚶","🛏️","🌙","🩹","🚻","🥬","👁️","👂"];const $=id=>document.getElementById(id);function render(){document.documentElement.lang=lang;for(const [key,v] of Object.entries(content[lang])){const el=$(key);if(el)el.textContent=v}$("selfLink").textContent=content[lang].selfButton;$("selfLink").href="tools/self-assessment.html?lang="+lang;$("syndromes").innerHTML=syndromes.map((s,i)=>'<details><summary><span class="syndrome-icon" aria-hidden="true">'+icons[i]+'</span>'+s[lang==="tr"?0:2]+'</summary><p>'+s[lang==="tr"?1:3]+'</p></details>').join("")} $("tr").onclick=()=>{lang="tr";render()};$("en").onclick=()=>{lang="en";render()};render();</script></body></html>
