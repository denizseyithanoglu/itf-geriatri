<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Randevu ve İletişim | İTF Geriatri</title><style>:root{font:18px/1.6 system-ui,sans-serif;color:#203a30;background:#f7faf7}*{box-sizing:border-box}body{margin:0}header{background:#285b4d;color:white;padding:24px max(22px,calc((100vw - 980px)/2))}header a{color:white}.lang{float:right}.lang button{padding:9px;border:0;border-radius:6px;background:white;color:#285b4d;font:inherit;cursor:pointer}main{max-width:980px;margin:auto;padding:22px}h1{font-size:1.9rem}h2{color:#285b4d;font-size:1.34rem;margin-top:0}h3{font-size:1.05rem;margin:7px 0}section{background:white;border:1px solid #d5e5d9;border-radius:13px;padding:22px;margin:17px 0}.steps{counter-reset:steps;padding:0;list-style:none}.steps li{counter-increment:steps;display:flex;gap:12px;margin:14px 0}.steps li:before{content:counter(steps);background:#285b4d;color:white;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none;font-weight:800}.muted{font-size:.88rem;color:#58685d}.notice{background:#fff2dc;border-left:4px solid #b2822d;padding:13px;border-radius:6px}.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.service{padding:14px;border-radius:9px;border:1px solid #dce9df;background:#f9fcf9}.service h3{margin:0 0 5px}.button{display:inline-flex;padding:11px 14px;align-items:center;min-height:45px;border-radius:8px;text-decoration:none;background:#285b4d;color:white;font-weight:750}.outline{background:#fff;border:2px solid #285b4d;color:#285b4d}.actions{display:flex;flex-wrap:wrap;gap:10px}.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.info>div{border:1px solid #dce9df;border-radius:8px;padding:13px;overflow-wrap:anywhere}.map{width:100%;height:300px;border:1px solid #dce9df;border-radius:10px}.list{margin:8px 0;padding-left:24px}a:focus-visible,button:focus-visible{outline:3px solid orange;outline-offset:2px}@media(max-width:620px){main{padding:12px}section{padding:15px}.services,.info{grid-template-columns:1fr}.map{height:250px}}</style></head><body><header><a href="index.html" id="back">← Ana sayfa</a><div class="lang"><button id="tr" type="button">TR</button> <button id="en" type="button">EN</button></div><h1 id="title">Randevu ve İletişim</h1></header><main><p id="intro"></p><p class="notice" id="warning"></p><section><h2 id="appointment"></h2><ol class="steps" id="steps"></ol><div class="actions"><a class="button" id="facultyBtn" href="https://istanbultip.istanbul.edu.tr/tr" target="_blank" rel="noopener"></a><a class="button outline" id="mhrsBtn" href="https://www.mhrs.gov.tr/" target="_blank" rel="noopener"></a></div><p class="muted" id="mhrsNote"></p></section><section><h2 id="hours"></h2><p class="muted" id="serviceNote"></p><div class="services" id="services"></div></section><section><h2 id="contact"></h2><div class="info"><div><h3 id="phone"></h3><a href="tel:+902124142000">0212 414 20 00</a><p id="phoneDetail" class="muted"></p></div><div><h3 id="email"></h3><p id="emailDetail"></p></div><div><h3 id="address"></h3><p id="addressDetail"></p></div></div></section><section><h2 id="mapTitle"></h2><p id="mapDesc"></p><iframe class="map" title="İstanbul Tıp Fakültesi Çapa yerleşkesi" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=Istanbul%20Tip%20Fakultesi%20Capa%20Fatih%20Istanbul&amp;output=embed"></iframe><p><a class="button" id="mapBtn" href="https://www.google.com/maps/search/?api=1&amp;query=Istanbul%20Tip%20Fakultesi%20Capa%20Fatih%20Istanbul" target="_blank" rel="noopener"></a></p><h3 id="transport"></h3><ul id="transportTips" class="list"></ul></section><p class="notice" id="footer"></p></main><script>const translations={"tr":{"title":"Randevu ve İletişim","back":"← Ana sayfa","intro":"Geriatri polikliniğine başvuru, hizmet saatleri ve ulaşım hakkında bilgiler.","warning":"Poliklinik randevu yöntemi, birimlerin çalışma saatleri ve Geriatri'ye özel telefon/dahili numaraları henüz doğrulanmamıştır. Gitmeden önce İstanbul Tıp Fakültesi'nin güncel duyurularını kontrol ediniz.","appointment":"Randevu için nasıl başvurabilirim?","steps":["Önce İstanbul Tıp Fakültesi'nin resmî web sitesinden güncel randevu yöntemini kontrol edin.","Randevu ekranında veya hastanenin yönlendirmesinde Geriatri Polikliniği'ni seçip seçemediğinizi doğrulayın. Üniversite hastanelerinin randevu işlemleri MHRS'den farklı olabilir.","Muayene günü, saat ve poliklinik yerini teyit edin. Varsa önceki tahlilleri, ilaç listenizi ve sağlık belgelerinizi yanınıza alın."],"facultyBtn":"Fakültenin resmî sitesini aç ↗","mhrsBtn":"MHRS (uygunluk kontrolü) ↗","mhrsNote":"MHRS genel ulusal randevu kanalıdır; İstanbul Tıp Fakültesi Geriatri randevusunun burada verildiği teyit edilmemiştir.","hours":"Birimler ve Çalışma Saatleri","serviceNote":"Aşağıdaki bilgiler kurumsal teyit bekleyen hizmet başlıklarıdır; açık olduğu anlamına gelmez.","services":[["Geriatri Polikliniği","Çalışma günleri ve saatleri: Kurumdan doğrulanacak","Hafta sonu hizmeti: Kurumdan doğrulanacak"],["Laboratuvar ve Kan Alma","Çalışma günleri ve saatleri: Kurumdan doğrulanacak","Hafta sonu hizmeti: Kurumdan doğrulanacak"],["Endoskopi ve Diğer İşlem Birimleri","İlgili birimin çalışma günleri ve saatleri: Kurumdan doğrulanacak","İşlem öncesi hazırlık ve başvuru: Kurumdan öğreniniz"]],"contact":"İletişim Bilgileri","phone":"Fakülte santral telefonu","phoneDetail":"0212 414 20 00 — Geriatri'ye özel dahili numara doğrulanacak","email":"Geriatri randevu e-postası","emailDetail":"Kurumsal e-posta adresi doğrulanacak; kişisel sağlık bilgilerinizi genel iletişim adreslerine göndermeyiniz.","address":"Hastane yerleşkesi","addressDetail":"İstanbul Üniversitesi İstanbul Tıp Fakültesi, Çapa, Fatih / İstanbul. Geriatri polikliniğinin güncel bina, kat ve giriş bilgisi teyit edilmelidir.","mapTitle":"Harita ve Ulaşım","mapDesc":"Harita İstanbul Tıp Fakültesi Çapa yerleşkesini gösterir; Geriatri'nin kesin poliklinik kapısını göstermez.","mapBtn":"Haritada aç ve yol tarifi al ↗","transport":"Ulaşım için öneriler","transportTips":["Gitmeden önce muayene yerinizin Çapa yerleşkesinde mi, başka bir poliklinik binasında mı olduğunu kurumdan doğrulayın.","Toplu taşıma veya araç güzergâhınızı seçerken güncel yol durumunu kontrol edin.","Hareket kısıtlılığınız varsa erişilebilir giriş ve tekerlekli sandalye desteğini önceden sorun."],"footer":"Bilgiler kurum tarafından teyit edildikçe güncellenecektir. Acil sağlık sorunlarında 112'yi arayın."},"en":{"title":"Appointments and Contact","back":"← Home","intro":"Information on appointments, clinic hours and how to reach the hospital.","warning":"Geriatrics-specific appointment routes, clinic hours and direct telephone extensions are still awaiting verification. Check the faculty's current information before visiting.","appointment":"How to arrange an appointment","steps":["Check the Istanbul Faculty of Medicine's official website for its current booking method.","Confirm how to select the Geriatrics outpatient clinic. University hospital bookings may differ from national MHRS appointments.","Verify your appointment date, time and location. Bring your medicine list and relevant medical documents."],"facultyBtn":"Open official faculty website ↗","mhrsBtn":"MHRS (check availability) ↗","mhrsNote":"MHRS is the national booking service; availability for this particular university geriatrics clinic has not been confirmed.","hours":"Units and Operating Hours","serviceNote":"The units listed below are provisional; operating times have not been confirmed.","services":[["Geriatrics Outpatient Clinic","Days and hours: To be confirmed by the hospital","Weekend service: To be confirmed"],["Laboratory and Phlebotomy","Days and hours: To be confirmed by the hospital","Weekend service: To be confirmed"],["Endoscopy and Other Procedures","Days and hours: To be confirmed by the relevant unit","Preparation and appointment process: Ask the unit"]],"contact":"Contact Information","phone":"Faculty main switchboard","phoneDetail":"0212 414 20 00 — Geriatrics extension pending verification","email":"Geriatrics appointment email","emailDetail":"Official email address awaiting verification. Do not send personal health details to general mailboxes.","address":"Hospital campus","addressDetail":"Istanbul University, Istanbul Faculty of Medicine, Çapa, Fatih, Istanbul. Confirm the specific outpatient building and entrance.","mapTitle":"Map and Directions","mapDesc":"Map shows the Istanbul Faculty of Medicine Çapa campus, not a verified Geriatrics clinic entrance.","mapBtn":"Open map and directions ↗","transport":"Getting here","transportTips":["Confirm the exact outpatient location with the hospital before traveling.","Check up-to-date public transit and driving conditions.","If mobility is limited, ask in advance about accessible entrances and wheelchair services."],"footer":"Information will be updated after institutional verification. For emergencies in Türkiye, call 112."}};let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"tr";const $=id=>document.getElementById(id);function render(){document.documentElement.lang=lang;const t=translations[lang];for(const k of ["title","back","intro","warning","appointment","facultyBtn","mhrsBtn","mhrsNote","hours","serviceNote","contact","phone","phoneDetail","email","emailDetail","address","addressDetail","mapTitle","mapDesc","mapBtn","transport","footer"])$(k).textContent=t[k];$("steps").innerHTML=t.steps.map(v=>"<li>"+v+"</li>").join("");$("services").innerHTML=t.services.map(s=>'<article class="service"><h3>'+s[0]+'</h3><p>'+s[1]+'</p><p class="muted">'+s[2]+'</p></article>').join("");$("transportTips").innerHTML=t.transportTips.map(x=>"<li>"+x+"</li>").join("")}$("tr").onclick=()=>{lang="tr";render()};$("en").onclick=()=>{lang="en";render()};render();</script></body></html>
